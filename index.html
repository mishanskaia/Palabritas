<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="1000 palabras">
<meta name="theme-color" content="#FFFBF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1A24" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<title>1000 palabras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFBF3; --ink:#1E1A2B; --muted:#6E6880; --line:#1E1A2B;
  --panel:#FFFFFF; --soft:#F3EEE4; --caption:#FFE45C;
  --a1:#E4007C; --a2:#F29F05; --a3:#009C9C;
  --a1t:#FFD6EA; --a2t:#FFE9C2; --a3t:#C9F0EE;
  --ok:#1E9E5A; --bad:#D7263D;
  color-scheme: light;
}
body.es{ --a1:#0077B6; --a2:#FFB800; --a3:#C8102E; --a1t:#D3ECFA; --a2t:#FFF0C2; --a3t:#FAD4DA; }
@media (prefers-color-scheme: dark){
  :root{ --paper:#1C1A24; --ink:#F4F0FA; --muted:#A8A2B8; --line:#F4F0FA; --panel:#262331; --soft:#2F2B3C; --caption:#E8C93A;
    --a1t:#4A1733; --a2t:#4A3612; --a3t:#123F3F; color-scheme: dark; }
  body.es{ --a1t:#13344A; --a2t:#4A3C10; --a3t:#4A1620; }
  .caption{ color:#1E1A2B; }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{animation:none!important;transition:none!important} }
body{margin:0;background:var(--paper);color:var(--ink);font-family:Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--a1);outline-offset:2px}
b{font-weight:700}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:3px solid var(--line);padding-top:env(safe-area-inset-top)}
main{padding-bottom:calc(80px + env(safe-area-inset-bottom))!important}
.topin{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.logo{font-weight:900;font-size:20px;letter-spacing:-.5px;white-space:nowrap}
.logo span{color:var(--a1)}
.switch{display:flex;border:2.5px solid var(--line);border-radius:999px;overflow:hidden;margin-left:auto}
.switch button{border:0;background:transparent;padding:6px 12px;font-weight:700;font-size:14px}
.switch button[aria-pressed=true]{background:var(--a1);color:#fff}
.prog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.ring{width:34px;height:34px}
.nav{max-width:980px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{flex:none;border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:4px 10px;font-size:13px;font-weight:500;white-space:nowrap}
.nav button[aria-current=true]{background:var(--ink);color:var(--paper)}
.nav button .n{font-weight:900;margin-right:4px;color:var(--a1)}
.nav button[aria-current=true] .n{color:var(--a2)}

main{max-width:980px;margin:0 auto;padding:20px 16px 80px}

/* hero */
.hero{position:relative;border:3.5px solid var(--line);border-radius:6px;background:var(--a1);color:#fff;overflow:hidden;padding:28px 22px 0;display:grid;grid-template-columns:1.2fr .8fr;gap:10px;min-height:340px;
  box-shadow:6px 6px 0 var(--line)}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.18) 1.6px,transparent 1.8px);background-size:12px 12px}
.hero h1{position:relative;font-size:clamp(34px,6.5vw,62px);line-height:.95;font-weight:900;margin:0 0 14px;letter-spacing:-1.5px}
.hero p{position:relative;margin:0 0 18px;font-size:17px;max-width:30ch}
.hero .cta{position:relative;border:3px solid var(--line);background:var(--a2);color:#1E1A2B;font-weight:900;font-size:17px;padding:10px 18px;border-radius:8px;box-shadow:4px 4px 0 var(--line);margin-bottom:26px}
.hero .cta:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
.hero .art{position:relative;align-self:end;display:flex;flex-direction:column;align-items:center}
.hero .art svg{width:min(240px,100%);height:auto;display:block}
.hero .say{background:#fff;color:#1E1A2B;border:3px solid var(--line);border-radius:18px;padding:8px 14px;font-weight:900;font-size:19px;position:relative;margin-bottom:10px;transform:rotate(-3deg)}
.hero .say::after{content:"";position:absolute;left:46%;bottom:-14px;border:10px solid transparent;border-top-color:var(--line)}
@media (max-width:620px){.hero{grid-template-columns:1fr;padding-bottom:0}.hero .art{flex-direction:row;align-items:flex-end;gap:8px}.hero .art svg{width:150px}}

/* chapter */
.chhead{display:flex;align-items:flex-start;gap:14px;margin:34px 0 18px}
.chnum{flex:none;width:52px;height:52px;border:3px solid var(--line);background:var(--a2);color:#1E1A2B;font-weight:900;font-size:24px;display:grid;place-items:center;border-radius:50%;box-shadow:3px 3px 0 var(--line)}
.chhead h2{margin:4px 0 0;font-size:clamp(24px,4vw,34px);line-height:1.1;font-weight:900;letter-spacing:-.5px}

.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:0 0 18px}
.panel{grid-column:span 3;position:relative;border:3px solid var(--line);border-radius:4px;background:var(--panel);padding:12px;display:flex;gap:10px;align-items:flex-end;min-height:120px;overflow:hidden}
.panel.wide{grid-column:span 6}
.panel.mid{grid-column:span 4}.panel.nar{grid-column:span 2}
.panel::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1.5px,transparent 1.7px);background-size:10px 10px;opacity:.55}
.panel.k-L{--dot:var(--a1t);background:var(--panel)}
.panel.k-O{--dot:var(--a3t);flex-direction:row-reverse}
.panel .av{position:relative;flex:none;width:76px;height:76px}
.panel .av svg{width:100%;height:100%}
.bub{position:relative;background:var(--panel);border:2.5px solid var(--line);border-radius:16px;padding:9px 12px 10px;font-size:15.5px;line-height:1.42;flex:1;margin-bottom:22px}
.k-L .bub{background:color-mix(in srgb,var(--a1t) 55%,var(--panel))}
.k-O .bub{background:color-mix(in srgb,var(--a3t) 55%,var(--panel))}
.bub::after{content:"";position:absolute;bottom:-13px;width:18px;height:18px;background:inherit;border-right:2.5px solid var(--line);border-bottom:2.5px solid var(--line);transform:skewX(35deg) rotate(45deg) scale(.8)}
.k-L .bub::after{left:14px}
.k-O .bub::after{right:14px;transform:skewX(-35deg) rotate(45deg) scale(.8)}
.who{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}
.speak{border:2px solid var(--line);background:var(--panel);border-radius:999px;width:30px;height:30px;display:inline-grid;place-items:center;padding:0;vertical-align:middle;margin-left:6px;flex:none}
.speak svg{width:15px;height:15px}
.speak.on{background:var(--a2)}
.bub .speak{float:right;margin:-2px -4px 2px 8px}
.caption{grid-column:span 6;position:relative;background:var(--caption);border:3px solid var(--line);border-radius:2px;padding:10px 14px;font-family:Caveat,'Segoe Print','Bradley Hand','Marker Felt',cursive;font-size:23px;line-height:1.2;transform:rotate(-.4deg)}
.caption b{font-weight:700}
.shout .bub{font-weight:900;font-size:22px;letter-spacing:.5px}
@media (max-width:620px){.panel,.panel.mid,.panel.nar{grid-column:span 6}.panel{padding:10px 8px;gap:6px;min-height:0}.panel .av{width:46px;height:46px}.bub{font-size:15px}}
@media (max-width:520px){.topin{gap:8px;padding:8px 12px}.logo{font-size:16px}.logo span{display:none}.switch button{padding:5px 9px;font-size:13px}.prog{font-size:12px;gap:4px}.ring{width:26px;height:26px}.nav{padding:0 12px 8px}}

.intro{font-size:20px;font-weight:700;line-height:1.3;margin:26px 0 12px;max-width:52ch}
.ptext{max-width:62ch;margin:0 0 14px}
.tip{position:relative;border:3px solid var(--line);background:var(--a2t);border-radius:6px;padding:12px 16px 13px 16px;margin:16px 0;box-shadow:4px 4px 0 var(--line);max-width:720px}
.tip .lb{display:inline-block;background:var(--line);color:var(--paper);font-weight:700;font-size:13px;padding:1px 8px;border-radius:4px;margin-bottom:6px}
.tip.c-ROSA{background:var(--a1t)} .tip.c-TURQ{background:var(--a3t)} .tip.c-VERDE{background:color-mix(in srgb,var(--ok) 22%,var(--panel))}

/* words */
.deck{border:3px solid var(--line);border-radius:6px;background:var(--panel);margin:12px 0 22px;overflow:hidden}
.dtool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:3px solid var(--line);background:var(--soft)}
.dtool h3{margin:0 auto 0 0;font-size:16px;font-weight:900}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.chip.go{background:var(--a2);color:#1E1A2B;font-weight:700}
.dcount{font-size:13px;color:var(--muted)}
.wl{list-style:none;margin:0;padding:0;columns:2;column-gap:0}
@media (max-width:700px){.wl{columns:1}}
.w{break-inside:avoid;display:grid;grid-template-columns:34px 1fr auto;gap:2px 8px;align-items:center;padding:7px 12px;border-bottom:1px dashed color-mix(in srgb,var(--line) 25%,transparent)}
.w .no{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.w .es{border:0;background:none;padding:0;text-align:left;font-weight:700;font-size:15.5px}
.w .es:hover{color:var(--a1)}
.w .ru{grid-column:2;font-size:14px;color:var(--muted);transition:filter .2s}
.hide .w .ru{filter:blur(6px);cursor:pointer;user-select:none}
.hide .w .ru.show{filter:none}
.w .kn{grid-row:1/3;grid-column:3;border:2px solid var(--line);background:var(--panel);width:30px;height:30px;border-radius:8px;padding:0;display:grid;place-items:center}
.w .kn svg{width:16px;height:16px;opacity:.25}
.w.known .kn{background:var(--ok);border-color:var(--ok)}
.w.known .kn svg{opacity:1;color:#fff}
.w.known .es{text-decoration:line-through;text-decoration-color:var(--ok);text-decoration-thickness:2px}

.rules{border:3px solid var(--line);border-radius:6px;overflow:hidden;margin:10px 0 18px}
.rules div{display:grid;grid-template-columns:150px 1fr;gap:10px;padding:9px 12px;border-bottom:2px solid color-mix(in srgb,var(--line) 15%,transparent);font-size:15px}
.rules div:nth-child(odd){background:var(--a3t)}
@media (max-width:560px){.rules div{grid-template-columns:1fr;gap:2px}}

.pager{display:flex;justify-content:space-between;gap:10px;margin-top:30px}
.pager button{border:3px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 16px;font-weight:700;box-shadow:3px 3px 0 var(--line);max-width:48%}
.pager button.next{background:var(--a1);color:#fff;margin-left:auto}
.pager button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}

/* quiz */
dialog{border:3.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:0;width:min(520px,94vw);box-shadow:8px 8px 0 var(--line)}
dialog::backdrop{background:rgba(20,15,30,.55)}
.qh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:3px solid var(--line);background:var(--a2t)}
.qh strong{margin-right:auto}
.qh button{border:2px solid var(--line);background:var(--panel);border-radius:8px;width:32px;height:32px;padding:0}
.qb{padding:18px 16px 20px}
.qbar{height:8px;border:2px solid var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.qbar i{display:block;height:100%;background:var(--a1);transition:width .3s}
.qw{font-size:30px;font-weight:900;line-height:1.15;margin:4px 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qhint{color:var(--muted);font-size:14px;margin-bottom:14px}
.opts{display:grid;gap:8px}
.opts button{border:2.5px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px;text-align:left;font-size:15.5px}
.opts button.right{background:var(--ok);color:#fff;border-color:var(--ok)}
.opts button.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.qnext{margin-top:14px;border:3px solid var(--line);background:var(--a2);color:#1E1A2B;font-weight:900;border-radius:8px;padding:9px 16px;box-shadow:3px 3px 0 var(--line)}
.score{font-size:46px;font-weight:900;margin:0}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(200%);visibility:hidden;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:14px;transition:transform .25s;z-index:50;max-width:92vw}
.toast.on{transform:translateX(-50%) translateY(0);visibility:visible}
.foot{color:var(--muted);font-size:13px;margin-top:40px;max-width:62ch}

.done{color:var(--ok);font-weight:900}
.train{display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:center;border:3.5px solid var(--line);border-radius:6px;background:var(--a3t);padding:16px 18px;margin:30px 0 0;box-shadow:6px 6px 0 var(--line);position:relative;overflow:hidden}
.train::before{content:"";position:absolute;inset:0;background-image:radial-gradient(color-mix(in srgb,var(--a3) 25%,transparent) 1.5px,transparent 1.7px);background-size:11px 11px;pointer-events:none}
.train>*{position:relative}
.train h3{margin:0 0 6px;font-size:22px;font-weight:900}
.train p{margin:0 0 10px;max-width:58ch}
.cta2{border:3px solid var(--line);background:var(--a1);color:#fff;font-weight:900;font-size:16px;padding:9px 16px;border-radius:8px;box-shadow:4px 4px 0 var(--line)}
.cta2:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}
@media (max-width:560px){.train{grid-template-columns:70px 1fr;padding:14px}}
.ttype{font-weight:700;color:var(--a1);margin-bottom:10px}
.fb{margin-top:12px;padding:8px 12px;border-radius:8px;border:2px solid var(--line)}
.fb.g{background:color-mix(in srgb,var(--ok) 22%,var(--panel))}.fb.b{background:color-mix(in srgb,var(--bad) 18%,var(--panel))}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}.match>div{display:grid;gap:7px;align-content:start}
.match button,.bank button,.built button,.acc button{border:2.5px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;font-size:15px;text-align:left}
.match button.sel{background:var(--a2t);transform:translate(-2px,-2px);box-shadow:2px 2px 0 var(--line)}
.match button.right{background:var(--ok);color:#fff;border-color:var(--ok);opacity:.75}
.match button.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.bigplay{width:64px;height:64px;border:3px solid var(--line);border-radius:50%;background:var(--a2);color:#1E1A2B;display:grid;place-items:center;box-shadow:3px 3px 0 var(--line);padding:0}
.bigplay svg{width:30px;height:30px}.bigplay.on{background:var(--a1);color:#fff}
.sent{font-size:20px;line-height:1.45;margin:4px 0 12px}
.gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--a1);color:var(--a1);font-weight:700;text-align:center}
.gap.filled{color:var(--ok);border-color:var(--ok)}
.typerow{display:flex;gap:8px}
.typerow input{flex:1;min-width:0;border:3px solid var(--line);border-radius:8px;padding:9px 12px;font:inherit;font-size:18px;background:var(--panel);color:var(--ink)}
.acc{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.acc button{padding:4px 11px;text-align:center}
.built{min-height:52px;border:2.5px dashed var(--line);border-radius:10px;padding:7px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.built.okb{border-style:solid;background:color-mix(in srgb,var(--ok) 18%,var(--panel))}.built.badb{border-style:solid;background:color-mix(in srgb,var(--bad) 14%,var(--panel))}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.bank button:disabled{opacity:.2}
.missl{text-align:left;margin:0 0 14px;padding-left:18px;max-height:160px;overflow:auto}
dialog{max-height:92vh;overflow:auto}

.chtools{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:-6px 0 18px}
.scene{margin:26px 0 10px}
.scene span{display:inline-block;background:var(--ink);color:var(--paper);font-weight:900;font-size:17px;padding:5px 14px 6px;border-radius:3px;transform:rotate(-1.2deg);box-shadow:3px 3px 0 var(--a1)}
.rubtn{display:block;border:0;background:none;padding:4px 0 0;font-size:12.5px;font-weight:700;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.rubtn[aria-expanded=true]{color:var(--a1)}
.rul{display:block;font-size:14px;color:var(--muted);line-height:1.4;margin-top:3px;font-style:italic}
.rul[hidden]{display:none}
.vw{border-bottom:2px dotted color-mix(in srgb,var(--ink) 45%,transparent);cursor:pointer}
.vw.cur{border-bottom:2.5px solid var(--a1);background:color-mix(in srgb,var(--a1) 9%,transparent);border-radius:2px}
.vw:hover{background:var(--a2t)}
.pop{position:fixed;z-index:60;background:var(--panel);border:3px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:5px 5px 0 var(--line)}
.pes{font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.pru{color:var(--muted);margin:2px 0 8px}
.pmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.pmeta .chip{font-size:12px;padding:3px 9px}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="logo">1000 <span>palabras</span></div>
    <div class="switch" role="group" aria-label="Вариант испанского">
      <button id="vMx" aria-pressed="true">Мексика</button>
      <button id="vEs" aria-pressed="false">Испания</button>
    </div>
    <div class="prog" title="Отмечено как «знаю»">
      <svg class="ring" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="currentColor" stroke-opacity=".2" stroke-width="5"/><circle id="ringC" cx="18" cy="18" r="15" fill="none" stroke="var(--ok)" stroke-width="5" stroke-linecap="round" stroke-dasharray="94.25" stroke-dashoffset="94.25" transform="rotate(-90 18 18)"/></svg>
      <span id="progT">0 / 1000</span>
    </div>
  </div>
  <nav class="nav" id="nav" aria-label="Главы"></nav>
</header>
<main id="main"></main>
<dialog id="quiz"></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
/* Outside Claude there is no window.storage: fall back to the phone's own storage so progress survives */
(function(){
  if(window.storage) return;
  let ls=null; try{ ls=window.localStorage; ls.setItem('__t','1'); ls.removeItem('__t'); }catch(e){ ls=null; }
  const mem={};
  const get=k=>ls?ls.getItem('p1000:'+k):(mem[k]??null), set=(k,v)=>{ if(ls) ls.setItem('p1000:'+k,v); else mem[k]=v; }, del=k=>{ if(ls) ls.removeItem('p1000:'+k); else delete mem[k]; };
  window.storage={
    async get(k){ const v=get(k); if(v===null) throw new Error('not found'); return {key:k,value:v,shared:false}; },
    async set(k,v){ set(k,v); return {key:k,value:v,shared:false}; },
    async delete(k){ del(k); return {key:k,deleted:true,shared:false}; },
    async list(){ return {keys:[],shared:false}; }
  };
})();
</script>
<script>
const DATA = {"mx": [{"title": "Знакомьтесь, это Лена — она получила офер в Мехико", "color": "ROSA", "items": [{"t": "b", "who": "", "kind": "L", "text": "¡Me voy a México! То есть... Я ЕДУ В МЕКСИКУ!!!"}, {"t": "b", "who": "", "kind": "L", "text": "Так, что я уже знаю по-испански? <b>Hola, me llamo Elena, pero todos me dicen Lena. Tengo veintiocho años. Soy de Rusia. Me gusta el surf, el café y los gatos.</b>"}, {"t": "b", "who": "", "kind": "L", "text": "Коллега из Мехико сказала, что так никто не разговаривает, и прислала «как надо». Я ничего не поняла. ¡No manches!"}, {"t": "b", "who": "Коллега", "kind": "O", "text": "— ¿Qué onda, güey? ¿Todo chido?<br/>— Sí, todo padrísimo.<br/>— ¡Órale! ¿Vamos al antro el viernes?<br/>— Sale, pero ahorita no tengo lana... ni modo."}, {"t": "b", "who": "", "kind": "N", "text": "На примере приключений Лены вы выучите 1000 самых нужных испанских слов — с мексиканским уклоном. Начнём с того, чего нет в учебниках: со сленга."}, {"t": "scene", "title": "Видеозвонок с будущей коллегой"}, {"t": "b", "who": "", "kind": "N", "text": "За неделю до вылета Лене звонит Софи — её будущая коллега из Мехико."}, {"t": "b", "who": "Софи", "kind": "O", "text": "¡Hola, Lena! ¿Qué onda? Soy Sofía, tu nueva compañera.", "ru": "Привет, Лена! Как дела? Я Софи, твоя новая коллега.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¡Hola, Sofía! Todo bien... creo. Perdón, ¿qué significa «qué onda»?", "ru": "Привет, Софи! Всё хорошо... наверное. Извини, что значит «qué onda»?", "pure": true}, {"t": "b", "who": "Софи", "kind": "O", "text": "Es como «¿qué tal?». Aquí en la oficina todos hablamos así. Es muy chido.", "ru": "Это как «как дела?». У нас в офисе все так говорят. Это очень круто.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿«Chido» es «bueno»?", "ru": "«Chido» — это «хорошо»?", "pure": true}, {"t": "b", "who": "Софи", "kind": "O", "text": "¡Exacto! Y si algo es muy, muy bueno, dices «¡qué padre!» o «padrísimo».", "ru": "Точно! А если что-то очень-очень хорошее, говоришь «¡qué padre!» или «padrísimo».", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Y «güey»? Lo escucho en todas las series.", "ru": "А «güey»? Я слышу его во всех сериалах.", "pure": true}, {"t": "b", "who": "Софи", "kind": "O", "text": "Ah, «güey» es para los cuates, los amigos. ¡Aguas! No se lo digas a tu jefe.", "ru": "А, «güey» — это для приятелей, для друзей. Осторожно! Не говори так начальнику.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¡Órale! Ya sé cinco palabras nuevas.", "ru": "Ого! Я уже знаю пять новых слов.", "pure": true}, {"t": "b", "who": "Софи", "kind": "O", "text": "¡Eres muy buena onda, Lena! Nos vemos en la chamba.", "ru": "Ты классная, Лена! Увидимся на работе.", "pure": true}, {"t": "scene", "title": "Чат с Софи"}, {"t": "b", "who": "Софи", "kind": "O", "text": "Oye, el viernes hay una pachanga en mi casa. ¿Vienes?", "ru": "Слушай, в пятницу у меня дома тусовка. Придёшь?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¡Claro! ¿Llevo algo?", "ru": "Конечно! Что-нибудь принести?", "pure": true}, {"t": "b", "who": "Софи", "kind": "O", "text": "Unas chelas. Y después vamos al antro.", "ru": "Пару бутылок пива. А потом идём в клуб.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Al antro? ¡No manches! Tengo poca lana...", "ru": "В клуб? Да ладно! У меня мало денег...", "pure": true}, {"t": "b", "who": "Софи", "kind": "O", "text": "Ni modo, güey. Yo invito. Pero el sábado vas a tener una cruda terrible.", "ru": "Ничего не поделаешь. Я угощаю. Но в субботу у тебя будет жуткое похмелье.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Neta? Bueno, ahorita no pienso en el sábado.", "ru": "Серьёзно? Ну, сейчас я о субботе не думаю.", "pure": true}, {"t": "b", "who": "Софи", "kind": "O", "text": "Jaja, cuidado con «ahorita». En México puede ser en cinco minutos... o nunca.", "ru": "Ха-ха, осторожно с «ahorita». В Мексике это может быть через пять минут... или никогда.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¡Híjole! Qué difícil es esto.", "ru": "Ох ты ж! Как это сложно.", "pure": true}, {"t": "b", "who": "Софи", "kind": "O", "text": "Tranquila. En un mes vas a hablar como una chilanga.", "ru": "Спокойно. Через месяц будешь говорить как настоящая жительница Мехико.", "pure": true}, {"t": "intro", "text": "Хотите звучать как местные, а не как учебник? Вот слова, которые в Мехико слышно на каждом углу:"}, {"t": "words", "title": null, "tag": "сленг", "items": [["¿Qué onda?", "как дела? что происходит?"], ["chido", "классный, крутой"], ["padre / padrísimo", "классный / суперский"], ["¡Órale!", "ого! / давай! / ну ладно"], ["¡Ándale!", "давай, быстрее! / точно!"], ["¿Neta?", "серьёзно? правда?"], ["güey (wey)", "чувак (между друзьями)"], ["cuate", "приятель"], ["compa", "братан (от compañero)"], ["chavo / chava", "парень / девушка"], ["chamba", "работа"], ["chambear", "работать"], ["lana", "деньги, «бабки»"], ["chela", "пиво"], ["¡Aguas!", "осторожно!"], ["ahorita", "сейчас (или через час, или никогда)"], ["¿Mande?", "что-что? простите? (вежливо переспросить)"], ["buena onda", "классный, приятный (о человеке)"], ["mala onda", "неприятный; отстой"], ["ni modo", "ничего не поделаешь"], ["fresa", "мажор(ка), пафосный"], ["chilango", "житель Мехико"], ["la cruda", "похмелье"], ["el antro", "ночной клуб"], ["la pachanga", "вечеринка, тусовка"], ["cotorrear", "болтать, трепаться"], ["echar la hueva", "лениться, валяться"], ["¡Qué padre!", "как здорово!"], ["¡No manches!", "да ладно! не может быть!"], ["chamaco", "ребёнок, пацан"], ["la bronca", "проблема; разборка"], ["¡Sale!", "договорились! окей"], ["¡Va!", "идёт! давай"], ["¡Híjole!", "ох ты ж! ну и ну"], ["chafa", "дешёвка, некачественный"], ["apapachar", "обнимать, нежить"], ["rajarse", "слиться, передумать"], ["el chisme", "сплетня"], ["¡Qué oso!", "какой стыд! кринж!"], ["¡Aguántame tantito!", "подожди чуть-чуть!"]]}, {"t": "tip", "label": "ЛАЙФХАК", "text": "<b>Ahorita</b> — самое коварное слово Мексики: «прямо сейчас», «через пару часов» или «никогда». <b>Ahorita no</b> — вежливое «нет». А на <b>güey</b> обращаются только к друзьям: с начальником не стоит.", "color": "MARI"}, {"t": "tip", "label": "ОСТОРОЖНО", "text": "Глагол <b>coger</b> («брать» в Испании) в Мексике звучит вульгарно. Берите такси так: <b>tomar un taxi</b>, а вещи — <b>agarrar</b>.", "color": "ROSA"}]}, {"title": "Как читать по-испански", "color": "TURQ", "items": [{"t": "p", "text": "Хорошая новость: испанский читается почти так же, как пишется, поэтому транскрипция не нужна. Достаточно запомнить десяток правил — и любое слово из списка вы прочитаете правильно."}, {"t": "tip", "label": "ХОРОШАЯ НОВОСТЬ", "text": "В Латинской Америке не используют <b>vosotros</b> («вы» для группы друзей) — вместо него всегда <b>ustedes</b>. Минус одна форма в каждом спряжении. ¡Qué padre!", "color": "TURQ"}, {"t": "tip", "label": "ВАЖНО", "text": "Все существительные в этом списке даны с артиклем: <b>el</b> — мужской род, <b>la</b> — женский. Учите их вместе: «<b>la</b> mano», а не просто «mano» — иначе потом будете гадать. Ловушки: <b>el día, el mapa, el problema, el idioma</b> (м. р., хотя на -a), <b>la mano, la foto</b> (ж. р., хотя на -o).", "color": "ROSA"}, {"t": "scene", "title": "Тренировка произношения"}, {"t": "b", "who": "", "kind": "N", "text": "Лена тренирует произношение перед зеркалом. Нажмите на динамик и повторяйте вслух — это классические испанские скороговорки."}, {"t": "b", "who": "", "kind": "L", "text": "Tres tristes tigres tragaban trigo en un trigal.", "ru": "Три грустных тигра глотали пшеницу на пшеничном поле.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Erre con erre, cigarro; erre con erre, barril. Rápido corren los carros, cargados de azúcar del ferrocarril.", "ru": "«Эрре» с «эрре» — сигара, «эрре» с «эрре» — бочка. Быстро бегут вагоны, гружённые сахаром с железной дороги.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Pablito clavó un clavito. ¿Qué clavito clavó Pablito?", "ru": "Паблито забил гвоздик. Какой гвоздик забил Паблито?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "El cielo está enladrillado. ¿Quién lo desenladrillará?", "ru": "Небо выложено кирпичом. Кто его разберёт?", "pure": true}, {"t": "b", "who": "", "kind": "N", "text": "Если язык заплетается — это нормально. Испанцы тоже спотыкаются."}], "rules": [["<b>c</b> + e/i, <b>z</b>", "[с] — в Мексике «шепелявого» испанского звука нет: <b>cena</b> [сэна], <b>zapato</b> [сапато]"], ["<b>c</b> + a/o/u, <b>qu</b> + e/i", "[к]: <b>casa</b> [каса], <b>queso</b> [кэсо] — u не читается"], ["<b>g</b> + e/i, <b>j</b>", "[х]: <b>gente</b> [хэнтэ], <b>jugo</b> [хуго]"], ["<b>gu</b> + e/i", "[г]: <b>guerra</b> [гэрра]; <b>güe</b> с точками — [гуэ]: <b>güero</b>"], ["<b>h</b>", "не читается никогда: <b>hola</b> [ола], <b>hoy</b> [ой]"], ["<b>ll</b>, <b>y</b>", "[й]: <b>llave</b> [йавэ], <b>yo</b> [йо]"], ["<b>ñ</b>", "[нь]: <b>mañana</b> [маньяна]"], ["<b>r</b> / <b>rr</b>", "одинарное — один удар языком; <b>rr</b> и <b>r</b> в начале слова — раскатистое: <b>perro</b>, <b>Rusia</b>"], ["<b>v</b> = <b>b</b>", "читаются одинаково, почти как [б]: <b>vino</b> [бино]"], ["<b>x</b>", "в «México», «Oaxaca» — [х]; в «taxi» — [кс]; в индейских словах бывает [ш]"], ["Ударение", "слово на гласную, -n, -s — на предпоследний слог (<b>casa, hablan</b>); на другую согласную — на последний (<b>hablar, ciudad</b>). Всё остальное помечено знаком: <b>café, música</b>"]]}, {"title": "Лена собирает чемодан", "color": "MARI", "items": [{"t": "b", "who": "", "kind": "L", "text": "Tengo que hacer la maleta. Надо попросить <b>mamá</b> cuidar a mis gatos."}, {"t": "b", "who": "", "kind": "L", "text": "Pasaporte — sí. Boleto — sí. Bloqueador — sí. ¿La tabla de surf? Bueno... ¿por qué no?"}, {"t": "b", "who": "", "kind": "L", "text": "¿Pido un taxi al aeropuerto? ¡¿Cuánto?! Es muy caro. Ni modo, voy en metro. ¡Aguas, que llego tarde!"}, {"t": "b", "who": "", "kind": "N", "text": "Модный сленг — это, конечно, chido. Но без маленьких слов ни одной фразы не построить: артикли, союзы, предлоги, наречия и местоимения — это клей языка."}, {"t": "scene", "title": "Лена и кот"}, {"t": "b", "who": "", "kind": "L", "text": "Mira, gato: aquí está mi maleta. ¿Qué pongo dentro?", "ru": "Смотри, кот: вот мой чемодан. Что положить внутрь?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "La ropa, los zapatos y el pasaporte. Siempre olvido algo.", "ru": "Одежду, обувь и паспорт. Я всегда что-нибудь забываю.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Por qué estás encima de mi ropa? ¡No, no, no!", "ru": "Почему ты лежишь на моей одежде? Нет-нет-нет!", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Tampoco puedes dormir dentro de la maleta. Lo siento.", "ru": "Внутри чемодана тоже нельзя спать. Извини.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Ya sé que me vas a extrañar. Yo también a ti...", "ru": "Я знаю, что ты будешь по мне скучать. Я по тебе тоже...", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Pero mamá va a venir todos los días. Y a veces también la abuela.", "ru": "Но мама будет приходить каждый день. А иногда ещё и бабушка.", "pure": true}, {"t": "b", "who": "", "kind": "N", "text": "Кот смотрит на Лену так, будто она уезжает навсегда."}, {"t": "b", "who": "", "kind": "L", "text": "Solo es un año... o dos. Quizás más. Bueno, ¿quién sabe?", "ru": "Это всего на год... или на два. Может, больше. Ну, кто знает?", "pure": true}, {"t": "scene", "title": "Где мой паспорт?"}, {"t": "b", "who": "", "kind": "L", "text": "¿Dónde está mi cargador? ¿Debajo de la cama? No. ¿Detrás de la puerta? Tampoco.", "ru": "Где моя зарядка? Под кроватью? Нет. За дверью? Тоже нет.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Ah, aquí está, al lado del pasaporte. Siempre están juntos.", "ru": "А, вот она, рядом с паспортом. Они всегда вместе.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Cuándo sale el vuelo? Mañana temprano, a las seis. ¡Muy temprano!", "ru": "Когда вылет? Завтра рано, в шесть. Очень рано!", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Y para qué necesito tres bikinis? Para la playa, ¡por supuesto!", "ru": "А зачем мне три купальника? Для пляжа, разумеется!", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Entre la ropa y los libros, la maleta pesa casi treinta kilos. ¡Ay!", "ru": "Вместе с одеждой и книгами чемодан весит почти тридцать килограммов. Ой!", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Bueno, quizás no necesito todos los libros. Solo uno. O dos.", "ru": "Ладно, может, мне не нужны все книги. Только одна. Или две.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Y el bloqueador? Ya está. ¿Y la tabla de surf? Demasiado grande... pero sin ella no me voy.", "ru": "А крем от солнца? Уже есть. А доска для сёрфа? Слишком большая... но без неё я не уеду.", "pure": true}, {"t": "words", "title": "Артикли", "tag": "артикли", "items": [["el", "определённый артикль, м. р."], ["la", "определённый артикль, ж. р."], ["los", "определённый артикль, мн. ч. м. р."], ["las", "определённый артикль, мн. ч. ж. р."], ["un", "неопределённый артикль, м. р."], ["una", "неопределённый артикль, ж. р."], ["unos / unas", "несколько, какие-то"]]}, {"t": "words", "title": "Союзы", "tag": "союзы", "items": [["y (e)", "и (e — перед словами на i-/hi-)"], ["o (u)", "или (u — перед словами на o-/ho-)"], ["pero", "но"], ["porque", "потому что"], ["si", "если"], ["que", "что, который"], ["aunque", "хотя"], ["mientras", "пока, в то время как"], ["ni... ni", "ни... ни"], ["sino", "а (не это, а то)"], ["pues", "ну, так ведь"], ["así que", "так что"]]}, {"t": "words", "title": "Предлоги", "tag": "предлоги", "items": [["a", "к, в (направление)"], ["de", "из, от; (принадлежность)"], ["en", "в, на"], ["con", "с"], [" ija?", "ru": "Ты первый раз летишь в Мексику, дочка?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Sí, señora. Voy a vivir allí. Tengo un trabajo nuevo.", "ru": "Да, сеньора. Я буду там жить. У меня новая работа.", "pure": true}, {"t": "b", "who": "Сеньора", "kind": "O", "text": "¡Qué bien! Yo voy a ver a mi familia. Tengo tres hijos y cinco nietos.", "ru": "Как хорошо! А я лечу к семье. У меня трое детей и пятеро внуков.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Y viven todos en la misma ciudad?", "ru": "И все живут в одном городе?", "pure": true}, {"t": "b", "who": "Сеньора", "kind": "O", "text": "Mi hijo vive en el centro, en un departamento muy pequeño. Mi hija vive en un pueblo cerca del mar.", "ru": "Сын живёт в центре, в очень маленькой квартире. Дочь живёт в городке у моря.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¡Qué bonito! Yo también quiero vivir cerca del mar. Me encanta el agua.", "ru": "Как здорово! Я тоже хочу жить у моря. Обожаю воду.", "pure": true}, {"t": "b", "who": "Сеньора", "kind": "O", "text": "Mira, hija, la vida es corta. Hay que vivir en el lugar donde eres feliz.", "ru": "Послушай, дочка, жизнь короткая. Надо жить там, где ты счастлива.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Tiene razón, señora. Es una buena idea.", "ru": "Вы правы, сеньора. Это хорошая мысль.", "pure": true}, {"t": "scene", "title": "Который час?"}, {"t": "b", "who": "", "kind": "L", "text": "Perdón, ¿qué hora es?", "ru": "Извините, который час?", "pure": true}, {"t": "b", "who": "Парень", "kind": "O", "text": "Son las tres y media. ¿A qué hora es tu vuelo?", "ru": "Половина четвёртого. Во сколько твой рейс?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "A las cinco. Tengo una hora y media para comer algo.", "ru": "В пять. У меня полтора часа, чтобы что-нибудь съесть.", "pure": true}, {"t": "b", "who": "Парень", "kind": "O", "text": "¿Y cuánto tiempo dura el viaje?", "ru": "А сколько длится перелёт?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Catorce horas. ¡Y el lunes ya tengo que trabajar!", "ru": "Четырнадцать часов. А в понедельник мне уже на работу!", "pure": true}, {"t": "b", "who": "Парень", "kind": "O", "text": "Hoy es viernes. Tienes todo el fin de semana para descansar.", "ru": "Сегодня пятница. У тебя все выходные, чтобы отдохнуть.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Sí, el sábado y el domingo voy a dormir todo el día.", "ru": "Да, в субботу и воскресенье буду спать весь день.", "pure": true}, {"t": "b", "who": "Парень", "kind": "O", "text": "¡No, no! El primer fin de semana se va a la playa. Es la regla.", "ru": "Нет-нет! В первые выходные идут на пляж. Это правило.", "pure": true}, {"t": "scene", "title": "Магазин в аэропорту"}, {"t": "b", "who": "Продавщица", "kind": "O", "text": "¡Buenas tardes! ¿La puedo ayudar?", "ru": "Добрый день! Вам помочь?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Sí, busco un vestido para la playa. Algo sencillo, de un color claro.", "ru": "Да, ищу платье для пляжа. Что-нибудь простое, светлое.", "pure": true}, {"t": "b", "who": "Продавщица", "kind": "O", "text": "Tenemos este vestido blanco y esta camisa azul. ¿Qué color le gusta más?", "ru": "У нас есть это белое платье и эта голубая рубашка. Какой цвет вам больше нравится?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "El blanco es muy bonito. ¿Tienen zapatos del mismo color?", "ru": "Белое очень красивое. А обувь такого же цвета есть?", "pure": true}, {"t": "b", "who": "Продавщица", "kind": "O", "text": "Claro. Y esta bolsa también va muy bien con el vestido.", "ru": "Конечно. И эта сумка тоже отлично подходит к платью.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Ay, no. Mi maleta ya está llena de cosas. Solo el vestido, por favor.", "ru": "Ой, нет. Мой чемодан и так полон вещей. Только платье, пожалуйста.", "pure": true}, {"t": "b", "who": "Продавщица", "kin , ["el tipo", "тип, вид"], ["el nivel", "уровень"], ["el sueño", "сон; мечта"], ["el miedo", "страх"], ["la suerte", "удача"], ["la oportunidad", "возможность, шанс"], ["la noticia", "новость"], ["el mensaje", "сообщение"], ["el cambio", "изменение; сдача"], ["la vista", "вид"], ["el animal", "животное"], ["el árbol", "дерево"], ["el río", "река"], ["el lago", "озеро"], ["el cielo", "небо"], ["la luna", "луна"], ["la estrella", "звезда"], ["el viento", "ветер"], ["el calor", "жара"], ["la temperatura", "температура"], ["el invierno", "зима"], ["el verano", "лето"], ["la primavera", "весна"], ["el otoño", "осень"], ["la temporada de lluvias", "сезон дождей"], ["el lunes", "понедельник"], ["el martes", "вторник"], ["el miércoles", "среда"], ["el jueves", "четверг"], ["el viernes", "пятница"], ["el sábado", "суббота"], ["el domingo", "воскресенье"], ["el reloj", "часы"], ["la pared", "стена"], ["el piso", "этаж; пол"], ["el edificio", "здание"], ["la colonia", "район (Мексика)"], ["el vecino", "сосед"], ["la fecha", "дата"], ["el brazo", "рука (от плеча)"], ["la pierna", "нога"], ["el pelo", "волосы"], ["la boca", "рот"], ["la espalda", "спина"], ["el estómago", "живот, желудок"]]}]}, {"title": "Лена в аэропорту", "color": "VERDE", "items": [{"t": "b", "who": "", "kind": "L", "text": "¿Dónde está la pantalla? Ah, ahí. Mi vuelo es el AM 37 a la Ciudad de México."}, {"t": "b", "who": "", "kind": "L", "text": "¿Qué? ¿<b>Retrasado</b> tres horas? ¡Híjole! Никогда я не уеду в Мексику..."}, {"t": "b", "who": "", "kind": "L", "text": "Bueno, voy a tomar un café. Y un mezcal... No, mejor un café. Y luego un mezcal."}, {"t": "b", "who": "", "kind": "L", "text": "Por fin: el embarque. Asiento 32B — en medio, entre dos señores muy grandes. Perfecto. Надо было делать check-in онлайн, а не мемы листать."}, {"t": "scene", "title": "Регистрация на рейс"}, {"t": "b", "who": "Агент", "kind": "O", "text": "Buenas tardes. Su pasaporte y su boleto, por favor.", "ru": "Добрый день. Ваш паспорт и билет, пожалуйста.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Aquí tiene.", "ru": "Вот, пожалуйста.", "pure": true}, {"t": "b", "who": "Агент", "kind": "O", "text": "¿Va a documentar esta maleta?", "ru": "Вы будете сдавать этот чемодан?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Sí. Y la mochila es mi equipaje de mano.", "ru": "Да. А рюкзак — моя ручная кладь.", "pure": true}, {"t": "b", "who": "Агент", "kind": "O", "text": "Su maleta pesa veintiocho kilos. El máximo son veinticinco.", "ru": "Ваш чемодан весит двадцать восемь килограммов. Максимум — двадцать пять.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿¡Qué!? ¿Puedo sacar algo?", "ru": "Что?! Можно я что-нибудь достану?", "pure": true}, {"t": "b", "who": "Агент", "kind": "O", "text": "Claro. O puede pagar ochenta dólares.", "ru": "Конечно. Или можете заплатить восемьдесят долларов.", "pure": true}, {"t": "b", "who": "", "kind": "N", "text": "Через пять минут Лена стояла у стойки в трёх свитерах и двух куртках."}, {"t": "b", "who": "Агент", "kind": "O", "text": "Muy bien. Aquí tiene su pase de abordar. Puerta 14, asiento 32B.", "ru": "Отлично. Вот ваш посадочный талон. Выход 14, место 32B.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Es ventanilla o pasillo?", "ru": "Это у окна или у прохода?", "pure": true}, {"t": "b", "who": "Агент", "kind": "O", "text": "Ni ventanilla ni pasillo... en medio. Lo siento.", "ru": "Ни у окна, ни у прохода... посередине. Сожалею.", "pure": true}, {"t": "scene", "title": "В самолёте"}, {"t": "b", "who": "Стюардесса", "kind": "O", "text": "Señores pasajeros, bienvenidos a bordo. Vamos a despegar en diez minutos.", "ru": "Уважаемые пассажиры, добро пожаловать на борт. Мы взлетаем через десять минут.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Perdone, ¿me deja pasar? Necesito ir al baño.", "ru": "Простите, вы меня пропустите? Мне нужно в туалет.", "pure": true}, {"t": "b", "who": "Сеньор", d": "O", "text": "Bienvenida. Su habitación es la 405. Aquí tiene la llave. El elevador está a la izquierda."}, {"t": "b", "who": "", "kind": "L", "text": "Номер «с видом на город»... Вид на парковку. Y la regadera no tiene agua caliente. ¡Qué bonito!"}, {"t": "b", "who": "", "kind": "L", "text": "¿Me puede traer una secadora de pelo, por favor?"}, {"t": "b", "who": "", "kind": "L", "text": "Мне принесли... вентилятор. Bueno, también sirve."}, {"t": "b", "who": "", "kind": "L", "text": "Ладно, пока волосы сохнут — загляну в приложение для знакомств. Oye... este chavo está <b>guapo</b>. Y parece <b>buena gente</b>."}, {"t": "scene", "title": "Звонок на ресепшн"}, {"t": "b", "who": "", "kind": "L", "text": "Hola, buenas noches. Llamo de la habitación 405.", "ru": "Здравствуйте, добрый вечер. Звоню из номера 405.", "pure": true}, {"t": "b", "who": "Ресепшн", "kind": "O", "text": "Buenas noches, ¿en qué le puedo ayudar?", "ru": "Добрый вечер, чем могу помочь?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "La regadera no tiene agua caliente. Y no hay toallas.", "ru": "В душе нет горячей воды. И полотенец нет.", "pure": true}, {"t": "b", "who": "Ресепшн", "kind": "O", "text": "Lo siento mucho. Ahorita le mandamos toallas limpias.", "ru": "Мне очень жаль. Сейчас пришлём вам чистые полотенца.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Y otra cosa: los vecinos de la 406 son muy ruidosos.", "ru": "И ещё: соседи из 406 очень шумные.", "pure": true}, {"t": "b", "who": "Ресепшн", "kind": "O", "text": "¿Ruidosos? En la 406 no hay nadie, señorita.", "ru": "Шумные? В 406 никого нет, сеньорита.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "... ¿Nadie? ¿Y quién canta?", "ru": "... Никого? А кто тогда поёт?", "pure": true}, {"t": "b", "who": "Ресепшн", "kind": "O", "text": "Ah, es el mesero del bar. Canta muy mal, pero es muy buena persona.", "ru": "А, это официант из бара. Поёт он ужасно, но человек очень хороший.", "pure": true}, {"t": "scene", "title": "Листаем анкеты"}, {"t": "b", "who": "", "kind": "N", "text": "Пока сохнут волосы, Лена листает анкеты в приложении."}, {"t": "b", "who": "Профиль", "kind": "O", "text": "«Soy trabajador, puntual y muy serio. Busco una mujer educada y tranquila.»", "ru": "«Я трудолюбивый, пунктуальный и очень серьёзный. Ищу воспитанную и спокойную женщину».", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Muy serio. Siguiente.", "ru": "Слишком серьёзный. Следующий.", "pure": true}, {"t": "b", "who": "Профиль", "kind": "O", "text": "«Soy divertido, cariñoso y un poco celoso.»", "ru": "«Я весёлый, ласковый и немного ревнивый».", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Celoso? No, gracias.", "ru": "Ревнивый? Нет, спасибо.", "pure": true}, {"t": "b", "who": "Профиль", "kind": "O", "text": "«Soy guapo, inteligente y rico.»", "ru": "«Я красивый, умный и богатый».", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Y muy presumido. ¡Siguiente!", "ru": "И очень хвастливый. Следующий!", "pure": true}, {"t": "b", "who": "Профиль", "kind": "O", "text": "«Soy un poco tímido, pero valiente: surfeo olas grandes. Me encantan los perros y el mar.»", "ru": "«Я немного застенчивый, но смелый: катаюсь на больших волнах. Обожаю собак и море».", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Tímido y valiente... ¡qué interesante! Este parece buena gente.", "ru": "Застенчивый и смелый... как интересно! Этот, кажется, хороший человек.", "pure": true}, {"t": "b", "who": "", "kind": "N", "text": "Анкета номер четыре — это Диего."}, {"t": "intro", "text": "Лена могла бы быть красноречивее. Чтобы описать человека, хватит этих слов:"}, {"t": "words", "title": null, "tag": "люди", "items": [["amable", "любезный"], ["simpático", "приятный, обаятельный"], ["antipático", "неприятный"], ["inteligente", "умный"], ["tonto", "глупый"], ["flojo", "ленивый (Мексика)"], ["trabajador", "трудолюбивый"], ["puntual", "пунктуальный"], ["sincero", "искренний"], ["celoso", "ревнивый"], ["cariñoso", "ласковый"], ["educado", "вежливый"], ["grosero", "грубый"], ["valiente", "смелый"], ["tímido", "застенчивый"], ["orgulloso", "гордый"], ["preocupado", "обеспокоенный"], ["sorprendido", "удивлённый"], ["emocionado", "взволнованный (в хорошем смысле)"], ["enamorado", "влюблённый"], ["soltero", "холостой, не в отношениях"], ["casado", "женатый, замужем"], ["sano", "здоровый"], ["chistoso", "смешной, забавный"], ["buena gente", "хороший человек"], ["presumido", "хвастливый, задавака"]]}]}, {"title": "Лена идёт на свидание", "color": "ROSA", "items": [{"t": "b", "who": "", "kind": "L", "text": "Mi primera cita en México. Se llama Diego. Что там в его <b>perfil</b>?"}, {"t": "b", "who": "Профиль", "kind": "O", "text": "«Arquitecto. Viajero. Me gustan los tacos, el surf y los perros. Busco a alguien con buen sentido del humor.»"}, {"t": "b", "who": "", "kind": "L", "text": "Surf y perros. Muy bien, Diego, muy bien."}, {"t": "b", "who": "Диего", "kind": "O", "text": "¡Hola, Lena! ¿Qué tal tu viaje?"}, {"t": "b", "who": "", "kind": "L", "text": "Largo. Y mi maleta se perdió."}, {"t": "b", "who": "Диего", "kind": "O", "text": "¡No manches! ¿Quieres ir por unos tacos? Conozco un lugar buenísimo aquí cerca."}, {"t": "b", "who": "", "kind": "L", "text": "¡Claro que sí! Тако — лучший ответ на любую драму."}, {"t": "scene", "title": "За столиком"}, {"t": "b", "who": "Диего", "kind": "O", "text": "Entonces, ¿estás soltera?", "ru": "Итак, ты не в отношениях?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Sí. Mi última relación terminó hace un año. ¿Y tú?", "ru": "Да. Мои последние отношения закончились год назад. А ты?", "pure": true}, {"t": "b", "who": "Диего", "kind": "O", "text": "Yo también. Mi ex era muy celosa. Sin confianza no hay relación, ¿no crees?", "ru": "Я тоже. Моя бывшая была очень ревнивой. Без доверия нет отношений, правда?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Totalmente. Para mí lo más importante es el respeto... y el sentido del humor.", "ru": "Абсолютно. Для меня главное — уважение... и чувство юмора.", "pure": true}, {"t": "b", "who": "Диего", "kind": "O", "text": "¿Te cuento un chiste?", "ru": "Рассказать анекдот?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¡Claro!", "ru": "Конечно!", "pure": true}, {"t": "b", "who": "Диего", "kind": "O", "text": "¿Qué le dice una ola a otra ola? ¡Nos vemos en la playa!", "ru": "Что одна волна говорит другой? Увидимся на пляже!", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Jaja, es malísimo.", "ru": "Ха-ха, это ужасно.", "pure": true}, {"t": "b", "who": "Диего", "kind": "O", "text": "Pero te estás riendo.", "ru": "Но ты же смеёшься.", "pure": true}, {"t": "b", "who": "", "kind": "N", "text": "Лена и правда смеётся. Кажется, химия есть."}, {"t": "scene", "title": "Переписка после свидания"}, {"t": "b", "who": "Диего", "kind": "O", "text": "Me encantó la cita. ¿Llegaste bien a casa?", "ru": "Мне очень понравилось свидание. Ты нормально добралась до дома?", "pure": true}, {"t": "b", "who": "", "kind": "N", "text": "Лена видит сообщение только через два часа — она уснула."}, {"t": "b", "who": "Диего", "kind": "O", "text": "¿Me dejaste en visto?", "ru": "Ты оставила меня на прочитанном?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¡No! Estaba dormida. Yo también la pasé muy bien.", "ru": "Нет! Я спала. Мне тоже было очень хорошо.", "pure": true}, {"t": "b", "who": "Диего", "kind": "O", "text": "¿Te puedo invitar a cenar el sábado? Conozco un lugar muy romántico.", "ru": "Можно пригласить тебя на ужин в субботу? Я знаю очень романтичное место.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Romántico? Uy... ¡Sale! Pero esta vez pago yo.", "ru": "Романтичное? Ох... Договорились! Но в этот раз плачу я.", "pure": true}, {"t": "b", "who": "Диего", "kind": "O", "text": "Ni hablar. Un beso.", "ru": "И речи быть не может. Целую.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Un beso.", "ru": "Целую.", "pure": true}, {"t": "b", "who": "", "kind": "N", "text": "И да, бабочки в животе — mariposas en el estómago."}, {"t": "intro", "text": "Словарик для свиданий — от первого «hola» до «la media naranja»:"}, {"t": "words", "title": null, "tag": "свидание", "items": [["la cita", "свидание"], ["coquetear", "флиртовать"], ["ligar", "знакомиться, «клеить»"], ["salir con", "встречаться с"], ["el perfil", "профиль"], ["la foto", "фото (ж. р.!)"], ["la pareja", "пара; партнёр"], ["la relación", "отношения"], ["enamorarse", "влюбиться"], ["el beso", "поцелуй"], ["besar", "целовать"], ["el abrazo", "объятие"], ["abrazar", "обнимать"], ["extrañar", "скучать (Лат. Ам.)"], ["querer", "хотеть; любить"], ["te quiero", "я тебя люблю (тепло)"], ["te amo", "я тебя люблю (сильно)"], ["los celos", "ревность"], ["terminar", "расстаться; закончить"], ["cortar", "бросить (кого-то, Мексика)"], ["el ex / la ex", "бывший / бывшая"], ["engañar", "обманывать, изменять"], ["la boda", "свадьба"], ["casarse", "жениться, выйти замуж"], ["el anillo", "кольцо"], ["comprometido", "помолвленный"], ["el divorcio", "развод"], ["el aniversario", "годовщина"], ["el regalo", "подарок"], ["las flores", "цветы"], ["la cena", "ужин"], ["el vino", "вино"], ["el brindis", "тост"], ["¡Salud!", "За здоровье! / Будь здоров!"], ["bailar", "танцевать"], ["el baile", "танец"], ["el sentido del humor", "чувство юмора"], ["la broma", "шутка"], ["bromear", "шутить"], ["reírse", "смеяться"], ["el chiste", "анекдот"], ["la sonrisa", "улыбка"], ["sonreír", "улыбаться"], ["la mirada", "взгляд"], ["la confianza", "доверие"], ["el respeto", "уважение"], ["la química", "химия (между людьми)"], ["la pasión", "страсть"], ["el cariño", "нежность, привязанность"], ["el detalle", "знак внимания, мелочь"], ["dejar en visto", "оставить «на прочитанном»"], ["la media naranja", "вторая половинка"], ["el flechazo", "любовь с первого взгляда"], ["mariposas en el estómago", "бабочки в животе"], ["la buena vibra", "хорошая энергетика"]]}]}, {"title": "Лена в такерии", "color": "MARI", "items": [{"t": "b", "who": "Диего", "kind": "O", "text": "¿Qué vas a pedir?"}, {"t": "b", "who": "", "kind": "L", "text": "Tres tacos al pastor, por favor. ¿Pican?"}, {"t": "b", "who": "Диего", "kind": "O", "text": "No, ni tantito."}, {"t": "b", "who": "", "kind": "L", "text": "...<br/>¡¡¡AGUA!!! ¡¡¡AGUAAA!!!"}, {"t": "b", "who": "", "kind": "N", "text": "«Ni tantito» в Мексике означает «будет больно». Всегда."}, {"t": "b", "who": "Диего", "kind": "O", "text": "Jajaja. La pasé muy bien contigo. ¿Nos vemos el sábado?"}, {"t": "b", "who": "", "kind": "L", "text": "¡Va! Pero esta vez sin chile, ¿eh?"}, {"t": "scene", "title": "На рынке"}, {"t": "b", "who": "Продавщица", "kind": "O", "text": "¿Qué le damos, güerita?", "ru": "Что вам дать, светленькая?", "pure": true}, {"t": "b", "who": "", "kind": "N", "text": "«Güerita» на рынках говорят почти любой покупательнице — это просто ласковое обращение."}, {"t": "b", "who": "", "kind": "L", "text": "Un kilo de jitomates, tres aguacates y unos limones, por favor.", "ru": "Килограмм помидоров, три авокадо и несколько лаймов, пожалуйста.", "pure": true}, {"t": "b", "who": "Продавщица", "kind": "O", "text": "¿Para guacamole? Llévese también una cebolla y un chile.", "ru": "Для гуакамоле? Возьмите ещё луковицу и перчик.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Pica mucho el chile?", "ru": "Перец очень острый?", "pure": true}, {"t": "b", "who": "Продавщица", "kind": "O", "text": "Este no, es un chile poblano. Ese de allá, el habanero, sí pica. ¡Aguas con ese!", "ru": "Этот нет, это поблано. А вон тот, хабанеро, — острый. Осторожно с ним!", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Y un kilo de tortillas. ¿Cuánto es?", "ru": "И килограмм тортилий. Сколько с меня?", "pure": true}, {"t": "b", "who": "Продавщица", "kind": "O", "text": "Son ciento veinte pesos. ¿Quiere probar el queso? Es de Oaxaca.", "ru": "Сто двадцать песо. Хотите попробовать сыр? Он из Оахаки.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Mmm... ¡qué rico! Deme medio kilo.", "ru": "М-м-м... как вкусно! Дайте полкило.", "pure": true}, {"t": "scene", "title": "Завтрак в фонде"}, {"t": "b", "who": "Официант", "kind": "O", "text": "Buenos días. ¿Qué le traigo?", "ru": "Доброе утро. Что вам принести?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Unos huevos rancheros y un café, por favor.", "ru": "Яичницу по-ранчерски и кофе, пожалуйста.", "pure": true}, {"t": "b", "who": "Официант", "kind": "O", "text": "¿Café de olla o americano?", "ru": "Кофе де олья или американо?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Qué es el café de olla?", "ru": "А что такое кофе де олья?", "pure": true}, {"t": "b", "who": "Официант", "kind": "O", "text": "Es café con canela y piloncillo. Muy dulce, muy rico.", "ru": "Это кофе с корицей и тростниковым сахаром. Очень сладкий, очень вкусный.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Pues uno de olla. Y un jugo de naranja.", "ru": "Тогда один де олья. И апельсиновый сок.", "pure": true}, {"t": "b", "who": "Официант", "kind": "O", "text": "¿Para comer aquí o para llevar?", "ru": "Здесь или с собой?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Para aquí. ¿Y me trae la cuenta después, por favor?", "ru": "Здесь. И потом принесёте счёт, пожалуйста?", "pure": true}, {"t": "b", "who": "Официант", "kind": "O", "text": "Claro que sí. ¡Buen provecho!", "ru": "Конечно. Приятного аппетита!", "pure": true}, {"t": "intro", "text": "Еда в Мексике — это половина разговоров. Вот что точно пригодится:"}, {"t": "words", "title": null, "tag": "еда", "items": [["el antojito", "закуска, уличная еда"], ["el taco", "тако"], ["la tortilla", "лепёшка (кукурузная)"], ["el maíz", "кукуруза"], ["los frijoles", "фасоль"], ["el chile", "острый перец"], ["el aguacate", "авокадо"], ["el limón", "лайм (Мексика)"], ["la "t": "b", "who": "Коллега", "kind": "O", "text": "Te agregamos al chat del equipo. Cualquier cosa, nos avisas."}, {"t": "b", "who": "", "kind": "L", "text": "Кажется, я зря волновалась. ¡Qué buena onda son todos!"}, {"t": "scene", "title": "Первое совещание"}, {"t": "b", "who": "Начальница", "kind": "O", "text": "Buenos días a todos. Hoy empezamos un proyecto nuevo con un cliente muy importante.", "ru": "Всем доброе утро. Сегодня мы начинаем новый проект с очень важным клиентом.", "pure": true}, {"t": "b", "who": "Начальница", "kind": "O", "text": "Lena, ¿puedes preparar el reporte para el viernes?", "ru": "Лена, можешь подготовить отчёт к пятнице?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Este viernes? ¿Cuál es la fecha límite exacta?", "ru": "К этой пятнице? Какой точный дедлайн?", "pure": true}, {"t": "b", "who": "Начальница", "kind": "O", "text": "El viernes a las doce. Y el lunes hacemos la presentación al cliente.", "ru": "В пятницу в двенадцать. А в понедельник у нас презентация для клиента.", "pure": true}, {"t": "b", "who": "Софи", "kind": "O", "text": "Tranquila, yo te ayudo con la presentación.", "ru": "Спокойно, я помогу тебе с презентацией.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¡Gracias! Es mi primera semana y ya tengo mucha tarea.", "ru": "Спасибо! Это моя первая неделя, а у меня уже куча задач.", "pure": true}, {"t": "b", "who": "Начальница", "kind": "O", "text": "Así es la vida en la oficina. ¡Bienvenida al equipo!", "ru": "Такова офисная жизнь. Добро пожаловать в команду!", "pure": true}, {"t": "scene", "title": "Разговор у кулера"}, {"t": "b", "who": "Софи", "kind": "O", "text": "¿Ya firmaste tu contrato?", "ru": "Ты уже подписала договор?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Sí, ayer. ¿Aquí pagan cada mes?", "ru": "Да, вчера. Здесь платят раз в месяц?", "pure": true}, {"t": "b", "who": "Софи", "kind": "O", "text": "No, cada quincena. Y en diciembre te dan el aguinaldo.", "ru": "Нет, раз в две недели. А в декабре дают годовую премию.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¡Qué padre! ¿Y se puede trabajar desde casa?", "ru": "Как здорово! А можно работать из дома?", "pure": true}, {"t": "b", "who": "Софи", "kind": "O", "text": "Sí, tenemos dos días de home office a la semana.", "ru": "Да, у нас два дня удалёнки в неделю.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Perfecto. Esos días voy a trabajar desde un café.", "ru": "Отлично. В эти дни буду работать из кафе.", "pure": true}, {"t": "b", "who": "Софи", "kind": "O", "text": "Jaja, pero no se lo digas al jefe.", "ru": "Ха-ха, только не говори начальнику.", "pure": true}, {"t": "scene", "title": "Комментарии под селфи"}, {"t": "b", "who": "", "kind": "N", "text": "Лена выкладывает селфи с командой. Через минуту приходят комментарии."}, {"t": "b", "who": "Комментарий", "kind": "O", "text": "q bonita foto!!", "ru": "какая красивая фотка!!", "pure": true}, {"t": "b", "who": "Комментарий", "kind": "O", "text": "tqm amiga, cdt mucho, bss", "ru": "очень тебя люблю, подруга, береги себя, целую", "pure": true}, {"t": "b", "who": "Комментарий", "kind": "O", "text": "x fin una foto tuya jajaja", "ru": "наконец-то твоя фотка ха-ха-ха", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "jajaja gracias a todos, salu2 desde la CDMX!", "ru": "ха-ха-ха, всем спасибо, привет из Мехико!", "pure": true}, {"t": "b", "who": "", "kind": "N", "text": "Последний комментарий — от Диего. Лена улыбается и ставит лайк."}, {"t": "intro", "text": "Ловите главные слова про работу и деньги:"}, {"t": "words", "title": null, "tag": "работа", "items": [["la oficina", "офис"], ["el jefe / la jefa", "начальник / начальница"], ["el compañero de trabajo", "коллега"], ["la junta", "совещание (Мексика)"], ["la reunión", "встреча"], ["el sueldo", "зарплата"], ["el contrato", "договор"], ["el proyecto", "проект"], ["la tarea", "задача; домашнее задание"], ["la fecha límite", "дедлайн"], ["el horario", "график, расписание"], ["el cliente", "клиент"], ["el banco", "банк"], ["el crédito", "кредит"], ["el préstamo", "заём"], ["la deuda", "долг"], ["la tasa de interés", "процентная ставка"], ["la inversión", "инвестиция"], ["el inmueble", "объект недвижимости"], ["la renta", "аренда (Мексика)"], ["el reporte", "отчёт (Лат. Ам.)"], ["la presentación", "презентация"], ["el correo", "почта, e-mail"], ["home office", "удалёнка (так и говорят в Мексике)"], ["renunciar", "уволиться"], ["contratar", "нанимать"], ["despedir", "уволить"], ["la entrevista", "собеседование, интервью"], ["la experiencia", "опыт"], ["la ganancia", "прибыль"], ["el currículum", "резюме"], ["el ascenso", "повышение"], ["las prestaciones", "соцпакет (Мексика)"], ["el aguinaldo", "годовая премия, «13-я зарплата»"], ["la quincena", "зарплата раз в две недели"], ["el pago", "платёж"]]}, {"t": "b", "who": "", "kind": "L", "text": "Посмотрим, что пишут в рабочем чате... «<b>ntp, ahorita lo vemos</b>», «<b>xfa manden el reporte</b>», «<b>jajaja tqm</b>». Слова вроде испанские, а ничего не понятно."}, {"t": "intro", "text": "В переписке испаноговорящие сокращают всё, что можно. Чтобы не спотыкаться:"}, {"t": "words", "title": null, "tag": "сокращения", "items": [["jajaja", "хахаха"], ["q", "que"], ["xq / pq", "porque / por qué"], ["tqm", "te quiero mucho — очень тебя люблю"], ["ntp", "no te preocupes — не волнуйся"], ["bn", "bien — хорошо"], ["xfa / porfa", "por favor — пожалуйста"], ["tmb", "también — тоже"], ["k onda", "qué onda — как дела?"], ["x", "por"], ["d", "de"], ["msj", "mensaje — сообщение"], ["finde", "fin de semana — выходные"], ["salu2", "saludos — привет, всем привет"], ["bss", "besos — целую"], ["cdt", "cuídate — береги себя"], ["ps", "pues — ну"], ["ntc", "no te creas — шучу"], ["vdd", "verdad — правда"], ["npn", "no pasa nada — ничего страшного"], ["gpi", "gracias por la invitación — спасибо за приглашение"], ["ok / okis", "окей"]]}, {"t": "tip", "label": "ФАКТ", "text": "«Хаха  {"t": "b", "who": "", "kind": "L", "text": "Salgo de casa a las ocho y llego a la oficina a las nueve.", "ru": "Выхожу из дома в восемь и прихожу в офис в девять.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Trabajo hasta las seis. Después, a veces voy al parque y camino un poco.", "ru": "Работаю до шести. Потом иногда иду в парк и немного гуляю.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Ceno con amigos o cocino en casa. Me acuesto a las doce... más o menos.", "ru": "Ужинаю с друзьями или готовлю дома. Ложусь в двенадцать... примерно.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Y los fines de semana? Duermo, leo, bailo y aprendo palabras nuevas. ¡Mil palabras!", "ru": "А по выходным? Сплю, читаю, танцую и учу новые слова. Тысячу слов!", "pure": true}, {"t": "scene", "title": "Концерт"}, {"t": "b", "who": "Софи", "kind": "O", "text": "¡Mira, ya empezó el concierto!", "ru": "Смотри, концерт уже начался!", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¡Me encanta esta canción! ¿Cómo se llama el grupo?", "ru": "Обожаю эту песню! Как называется группа?", "pure": true}, {"t": "b", "who": "Софи", "kind": "O", "text": "No me acuerdo. Pero tocan muy bien. ¡Vamos a bailar!", "ru": "Не помню. Но играют они отлично. Пойдём танцевать!", "pure": true}, {"t": "b", "who": "", "kind": "N", "text": "Час спустя."}, {"t": "b", "who": "", "kind": "L", "text": "¡Ay, no! ¡Perdí mi celular!", "ru": "Ой, нет! Я потеряла телефон!", "pure": true}, {"t": "b", "who": "Софи", "kind": "O", "text": "Tranquila, vamos a buscarlo. ¿Dónde lo dejaste?", "ru": "Спокойно, давай поищем. Где ты его оставила?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "No sé... estaba bailando.", "ru": "Не знаю... я танцевала.", "pure": true}, {"t": "b", "who": "Парень", "kind": "O", "text": "Perdona, ¿es tuyo este celular? Estaba en el suelo.", "ru": "Извини, это твой телефон? Он лежал на полу.", "pure": true}, {"t": "b", "who": "", "kind":
