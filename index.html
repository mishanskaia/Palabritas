)"]]}, {"t": "tip", "label": "ГРАММАТИКА НА ПОЛЯХ", "text": "Глаголы на <b>-se</b> (<b>levantarse, quedarse, irse</b>) — возвратные, как русские на «-ся»: <b>me levanto</b> — я встаю, <b>te quedas</b> — ты остаёшься. А <b>gustar</b> работает «наоборот»: <b>me gustan los tacos</b> — дословно «мне нравятся тако».", "color": "TURQ"}]}, {"title": "Месяц спустя", "color": "ROSA", "items": [{"t": "b", "who": "", "kind": "L", "text": "Ya entiendo cuando me hablan. Bueno... casi siempre. Ya tengo departamento, ya tengo cuates, y el sábado voy a surfear a Oaxaca con Diego."}, {"t": "b", "who": "", "kind": "L", "text": "¿La maleta? Llegó. Sin comida rusa. Ni modo."}, {"t": "b", "who": "", "kind": "N", "text": "Fin. Вы прошли все 1000 слов вместе с Леной. ¡Felicidades!"}, {"t": "scene", "title": "Разговор с Софи"}, {"t": "b", "who": "Софи", "kind": "O", "text": "Lena, ¡ya hablas muy bien! ¿Cómo aprendiste tan rápido?", "ru": "Лена, ты уже очень хорошо говоришь! Как ты так быстро научилась?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Escucho, repito y no tengo miedo de equivocarme. Bueno, sí tengo miedo... pero hablo igual.", "ru": "Слушаю, повторяю и не боюсь ошибаться. Ну, боюсь, конечно... но всё равно говорю.", "pure": true}, {"t": "b", "who": "Софи", "kind": "O", "text": "¿Y qué es lo más difícil?", "ru": "А что самое трудное?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Entender cuando la gente habla rápido. Y el chile, claro.", "ru": "Понимать, когда люди говорят быстро. И острый перец, конечно.", "pure": true}, {"t": "b", "who": "Софи", "kind": "O", "text": "¿Y lo más bonito?", "ru": "А что самое прекрасное?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "La gente. Aquí todos son muy amables. Ya no me siento extranjera.", "ru": "Люди. Здесь все очень дружелюбные. Я больше не чувствую себя иностранкой.", "pure": true}, {"t": "b", "who": "Софи", "kind": "O", "text": "Es que ya no lo eres. ¡Ya eres de aquí!", "ru": "Потому что ты больше не иностранка. Ты уже местная!", "pure": true}, {"t": "tip", "label": "КАК УЧИТЬ ЭТОТ СПИСОК", "text": "Учите по 20 слов в день — и через 50 дней пройдёте весь список. Не зубрите столбиком: прочитайте историю Лены, отметьте незнакомые слова и загрузите их в карточки (Anki или свой бот). Каждое новое слово сразу вставьте в свою фразу — так оно переходит из «узнаю» в «говорю».", "color": "MARI"}]}], "es": [{"title": "Знакомьтесь, это Лена — она переезжает на Канары", "color": "ROSA", "items": [{"t": "b", "who": "", "kind": "L", "text": "¡Me voy a Canarias! То есть... Я ЕДУ НА КАНАРЫ!!! Офер в Лас-Пальмасе, океан за окном, сёрф по выходным."}, {"t": "b", "who": "", "kind": "L", "text": "Так, что я знаю по-испански? <b>Hola, me llamo Elena, pero todos me llaman Lena. Tengo veintiocho años. Soy de Rusia. Me gusta el surf, el café y los gatos.</b>"}, {"t": "b", "who": "", "kind": "L", "text": "Будущая коллега из Мадрида уже написала. Я ничего не поняла. ¡Ostras!"}, {"t": "b", "who": "Коллега", "kind": "O", "text": "— ¡Tía, qué guay que vengas!<br/>— ¿Quedamos el viernes para unas cañas?<br/>— Vale, pero ando sin pasta...<br/>— ¡Venga, no seas cutre! Invito yo."}, {"t": "b", "who": "", "kind": "N", "text": "На примере приключений Лены вы выучите 1000 самых нужных испанских слов — в европейском варианте и с канарским акцентом. Начнём с того, чего нет в учебниках."}, {"t": "scene", "title": "Видеозвонок с будущей коллегой"}, {"t": "b", "who": "", "kind": "N", "text": "За неделю до вылета Лене звонит Марта — её будущая коллега, мадридка, которая уже пять лет живёт на Канарах."}, {"t": "b", "who": "Марта", "kind": "O", "text": "¡Hola, Lena! Soy Marta, tu nueva compañera. ¿Qué tal?", "ru": "Привет, Лена! Я Марта, твоя новая коллега. Как дела?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¡Hola, Marta! Bien... creo. Perdona, ¿qué significa «tía»? Me llamas «tía» en los mensajes.", "ru": "Привет, Марта! Хорошо... наверное. Извини, что значит «tía»? Ты называешь меня «tía» в сообщениях.", "pure": true}, {"t": "b", "who": "Марта", "kind": "O", "text": "Jaja, «tía» no es familia. Es como «chica» o «amiga». Lo usamos todo el rato.", "ru": "Ха-ха, «tía» — это не родственница. Это как «девушка» или «подруга». Мы так говорим постоянно.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Y «guay»?", "ru": "А «guay»?", "pure": true}, {"t": "b", "who": "Марта", "kind": "O", "text": "«Guay» es «muy bueno». ¡Tu nuevo trabajo es muy guay! También puedes decir «¡cómo mola!».", "ru": "«Guay» — это «очень хорошо». Твоя новая работа очень классная! Ещё можно сказать «¡cómo mola!».", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Vale. ¿Y qué significa «vale»?", "ru": "Ладно. А что значит «vale»?", "pure": true}, {"t": "b", "who": "Марта", "kind": "O", "text": "¡Ya lo estás usando! «Vale» es «de acuerdo». Los españoles decimos «vale» mil veces al día.", "ru": "Ты уже его используешь! «Vale» — это «договорились». Испанцы говорят «vale» тысячу раз в день.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¡Qué fuerte! Ya sé cinco palabras nuevas.", "ru": "Офигеть! Я уже знаю пять новых слов.", "pure": true}, {"t": "b", "who": "Марта", "kind": "O", "text": "¡Venga, que eres muy maja! Nos vemos en el curro.", "ru": "Ну всё, ты очень славная! Увидимся на работе.", "pure": true}, {"t": "scene", "title": "Чат с Мартой"}, {"t": "b", "who": "Марта", "kind": "O", "text": "Oye, el viernes quedamos con la peña para tomar unas cañas. ¿Te apuntas?", "ru": "Слушай, в пятницу мы с компанией идём выпить пива. Присоединишься?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¡Vale! Pero tengo poca pasta...", "ru": "Давай! Но у меня мало денег...", "pure": true}, {"t": "b", "who": "Марта", "kind": "O", "text": "Tranqui, las cañas en Canarias son baratísimas. Vas a flipar.", "ru": "Спокойно, пиво на Канарах очень дешёвое. Офигеешь.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Y después?", "ru": "А потом?", "pure": true}, {"t": "b", "who": "Марта", "kind": "O", "text": "Después, juerga hasta las cinco. En plan, como siempre.", "ru": "Потом гулянка до пяти. Ну, типа как обычно.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Hasta las cinco? ¡Ni de coña! El sábado quiero surfear.", "ru": "До пяти? Ни за что! В субботу я хочу сёрфить.", "pure": true}, {"t": "b", "who": "Марта", "kind": "O", "text": "Jaja, con resaca no se surfea bien, es verdad.", "ru": "Ха-ха, с похмелья сёрфить плохо, это правда.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Hay muchos guiris en la playa?", "ru": "На пляже много туристов?", "pure": true}, {"t": "b", "who": "Марта", "kind": "O", "text": "Mogollón. Pero en nuestra peña hay muy buen rollo, ya verás.", "ru": "Куча. Но в нашей компании очень классная атмосфера, вот увидишь.", "pure": true}, {"t": "scene", "title": "Сосед-канарец"}, {"t": "b", "who": "", "kind": "N", "text": "Первое утро на острове. Сосед по дому оказался очень разговорчивым."}, {"t": "b", "who": "Сосед-канарец", "kind": "O", "text": "¡Buenos días, mi niña! ¿Tú eres la rusa nueva?", "ru": "Доброе утро, дорогая! Ты новенькая из России?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Sí, buenos días. Me llamo Lena.", "ru": "Да, доброе утро. Меня зовут Лена.", "pure": true}, {"t": "b", "who": "Сосед-канарец", "kind": "O", "text": "¡Chacho, qué bien hablas! ¿Vas a la playa? Coge la guagua, que andando está lejos.", "ru": "Ничего себе, как ты хорошо говоришь! Идёшь на пляж? Садись на автобус, пешком далеко.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿La guagua? ¿Qué es la guagua?", "ru": "Guagua? А что такое guagua?", "pure": true}, {"t": "b", "who": "Сосед-канарец", "kind": "O", "text": "El autobús, mi niña. Y ponte las cholas, que el jable quema.", "ru": "Автобус, дорогая. И надень шлёпанцы — песок обжигает.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Perdón... ¿cholas? ¿jable?", "ru": "Простите... cholas? jable?", "pure": true}, {"t": "b", "who": "Сосед-канарец", "kind": "O", "text": "¡Ños! Hay fleje de palabras que aprender, ¿eh?", "ru": "Ох! Тебе ещё кучу слов учить, а?", "pure": true}, {"t": "intro", "text": "Испанский сленг, который слышно в любом баре от Мадрида до Лас-Пальмаса:"}, {"t": "words", "title": null, "tag": "сленг", "items": [["guay", "классный, крутой"], ["¡Qué guay!", "как классно!"], ["molar", "нравиться, быть крутым"], ["¡Cómo mola!", "как круто!"], ["tío / tía", "чувак / подруга (обращение)"], ["¡Vale!", "окей, ладно — самое испанское слово"], ["¡Venga!", "давай! ну же! / ну всё, пока!"], ["¡Qué fuerte!", "офигеть! с ума сойти!"], ["flipar", "офигевать, балдеть"], ["currar", "работать (разг.)"], ["el curro", "работа (разг.)"], ["la pasta", "деньги, «бабки»"], ["la caña", "маленькое разливное пиво"], ["majo", "славный, приятный"], ["chulo", "классный; задавака"], ["cutre", "убогий, дешёвый"], ["pijo", "мажор(ка)"], ["mogollón", "куча, очень много"], ["el guiri", "турист-иностранец"], ["la resaca", "похмелье"], ["ir de tapas", "ходить по барам и есть тапас"], ["chungo", "стрёмный, плохой"], ["¡Ostras!", "ничего себе! блин!"], ["¡Anda ya!", "да ладно! не может быть!"], ["estar de bajón", "быть не в духе"], ["la peña", "народ, компания"], ["en plan", "типа, как бы"], ["el rollo", "тема, дело; занудство"], ["buen rollo / mal rollo", "хорошая / плохая атмосфера"], ["cotilla", "сплетник, сплетница"], ["empollar", "зубрить"], ["la movida", "движуха; заморочка"], ["¡Ni de coña!", "ни за что!"], ["liarla", "натворить дел"], ["¡Qué morro!", "какая наглость!"], ["estar hasta las narices", "быть сытым по горло"], ["la juerga", "гулянка"]]}, {"t": "tip", "label": "ЛАЙФХАК", "text": "<b>Vale</b> испанцы говорят примерно каждые 20 секунд: «окей», «понял», «договорились», «ну хватит». А <b>guiri</b> — это вы, если ходите в носках с сандалиями и обедаете в 12:00.", "color": "MARI"}, {"t": "b", "who": "Сосед-канарец", "kind": "O", "text": "¡Chacho, mi niña! Coge la guagua, que hoy hay fleje de gente en la playa."}, {"t": "intro", "text": "На Канарах ещё и свои словечки — на материке их могут не понять:"}, {"t": "words", "title": null, "tag": "Канары", "items": [["la guagua", "автобус (Канары)"], ["las papas", "картошка (не patatas!)"], ["las papas arrugadas", "«сморщенная» картошка в солёной корочке"], ["el mojo", "соус мохо: picón — красный, verde — зелёный"], ["el millo", "кукуруза"], ["el gofio", "гофио, мука из обжаренного зерна"], ["¡Chacho! / ¡Chache!", "эй! слушай! ничего себе!"], ["¡Fos!", "фу! (отвращение)"], ["mi niño / mi niña", "дорогой / дорогая (обращение к кому угодно)"], ["fleje", "очень много, куча"], ["el machango", "шут, клоун"], ["totorota", "дурачок"], ["el enyesque", "закуска к выпивке"], ["las cotufas", "попкорн"], ["las cholas", "шлёпанцы"], ["el guachinche", "домашняя таверна с местным вином"], ["la calima", "пыльная дымка из Сахары"], ["el baifo", "козлёнок"], ["¡Ños!", "ох ты!"], ["chiquito", "(ирон.) огромный: ¡chiquito coche! — ну и машинища!"], ["el queque", "кекс"], ["el risco", "скала, утёс"], ["el jable", "светлый вулканический песок"], ["la vieja", "рыба-попугай (местный деликатес)"], ["los alisios", "пассаты (ветра)"]]}, {"t": "tip", "label": "ХОРОШО ЗНАТЬ", "text": "Глагол <b>coger</b> в Испании — абсолютно нормальное «брать»: <b>coger la guagua</b>, <b>coger el teléfono</b>. (А вот в Мексике и Аргентине так лучше не говорить — там оно вульгарное.)", "color": "ROSA"}]}, {"title": "Как читать по-испански (Испания и Канары)", "color": "TURQ", "items": [{"t": "p", "text": "Испанский читается почти так же, как пишется, поэтому транскрипция не нужна. Но у Испании и Канар есть свои особенности произношения — вот главное."}, {"t": "tip", "label": "VOSOTROS vs USTEDES", "text": "На материке «вы» для группы друзей — <b>vosotros</b>: <b>¿Venís esta noche?</b> (вы придёте сегодня?). Канарцы, как и латиноамериканцы, почти всегда говорят <b>ustedes</b>: <b>¿Vienen esta noche?</b> Понимать нужно обе формы.", "color": "TURQ"}, {"t": "tip", "label": "ВАЖНО", "text": "Все существительные даны с артиклем: <b>el</b> — мужской род, <b>la</b> — женский. Учите вместе. Ловушки: <b>el día, el mapa, el problema, el idioma</b> (м. р., хотя на -a), <b>la mano, la foto</b> (ж. р., хотя на -o).", "color": "ROSA"}, {"t": "scene", "title": "Тренировка произношения"}, {"t": "b", "who": "", "kind": "N", "text": "Лена тренирует произношение перед зеркалом. Нажмите на динамик и повторяйте вслух — это классические испанские скороговорки."}, {"t": "b", "who": "", "kind": "L", "text": "Tres tristes tigres tragaban trigo en un trigal.", "ru": "Три грустных тигра глотали пшеницу на пшеничном поле.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Erre con erre, cigarro; erre con erre, barril. Rápido corren los carros, cargados de azúcar del ferrocarril.", "ru": "«Эрре» с «эрре» — сигара, «эрре» с «эрре» — бочка. Быстро бегут вагоны, гружённые сахаром с железной дороги.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Pablito clavó un clavito. ¿Qué clavito clavó Pablito?", "ru": "Паблито забил гвоздик. Какой гвоздик забил Паблито?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "El cielo está enladrillado. ¿Quién lo desenladrillará?", "ru": "Небо выложено кирпичом. Кто его разберёт?", "pure": true}, {"t": "b", "who": "", "kind": "N", "text": "Если язык заплетается — это нормально. Испанцы тоже спотыкаются."}], "rules": [["<b>c</b> + e/i, <b>z</b>", "на материке — межзубный звук, как английское <i>th</i>: <b>cena</b> [θэна], <b>zapato</b> [θапато]. <b>На Канарах — обычное [с]</b>, как в Латинской Америке"], ["<b>c</b> + a/o/u, <b>qu</b> + e/i", "[к]: <b>casa</b> [каса], <b>queso</b> [кэсо] — u не читается"], ["<b>g</b> + e/i, <b>j</b>", "[х]: <b>gente</b>, <b>jamón</b>. В Мадриде звук жёсткий, «горловой»; на Канарах — мягкий, почти как английское h"], ["<b>gu</b> + e/i", "[г]: <b>guerra</b> [гэрра]; <b>güe</b> с точками — [гуэ]: <b>vergüenza</b>"], ["<b>h</b>", "не читается никогда: <b>hola</b> [ола], <b>hoy</b> [ой]"], ["<b>ll</b>, <b>y</b>", "[й]: <b>llave</b> [йавэ], <b>yo</b> [йо]"], ["<b>ñ</b>", "[нь]: <b>mañana</b> [маньяна]"], ["<b>s</b> в конце слога", "на Канарах часто «проглатывается» в лёгкий выдох: <b>las papas</b> звучит как [лах папах], <b>¿cómo estás?</b> — [комо эhтаh]"], ["<b>r</b> / <b>rr</b>", "одинарное — один удар языком; <b>rr</b> и <b>r</b> в начале слова — раскатистое: <b>perro</b>, <b>Rusia</b>"], ["<b>v</b> = <b>b</b>", "читаются одинаково, почти как [б]: <b>vino</b> [бино]"], ["<b>-ado</b>", "в разговоре <b>d</b> часто пропадает: <b>cansado</b> → [кансао]"], ["Ударение", "на гласную, -n, -s — на предпоследний слог (<b>casa, hablan</b>); на другую согласную — на последний (<b>hablar, ciudad</b>). Остальное помечено: <b>café, música</b>"]]}, {"title": "Лена собирает чемодан", "color": "MARI", "items": [{"t": "b", "who": "", "kind": "L", "text": "Tengo que hacer la maleta. Надо попросить <b>mamá</b> cuidar a mis gatos."}, {"t": "b", "who": "", "kind": "L", "text": "Pasaporte — sí. Billete — sí. Crema solar — ¡dos! ¿La tabla de surf? Por supuesto."}, {"t": "b", "who": "", "kind": "L", "text": "¿Cojo un taxi al aeropuerto? ¡¿Cuánto?! ¡Qué morro! Vale, voy en metro."}, {"t": "b", "who": "", "kind": "N", "text": "Сленг — это, конечно, guay. Но без маленьких слов ни одной фразы не построить: артикли, союзы, предлоги, наречия и местоимения — это клей языка."}, {"t": "scene", "title": "Лена и кот"}, {"t": "b", "who": "", "kind": "L", "text": "Mira, gato: aquí está mi maleta. ¿Qué pongo dentro?", "ru": "Смотри, кот: вот мой чемодан. Что положить внутрь?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "La ropa, los zapatos y el pasaporte. Siempre olvido algo.", "ru": "Одежду, обувь и паспорт. Я всегда что-нибудь забываю.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Por qué estás encima de mi ropa? ¡No, no, no!", "ru": "Почему ты лежишь на моей одежде? Нет-нет-нет!", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Tampoco puedes dormir dentro de la maleta. Lo siento.", "ru": "Внутри чемодана тоже нельзя спать. Извини.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Ya sé que me vas a echar de menos. Yo también a ti...", "ru": "Я знаю, что ты будешь по мне скучать. Я по тебе тоже...", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Pero mamá va a venir todos los días. Y a veces también la abuela.", "ru": "Но мама будет приходить каждый день. А иногда ещё и бабушка.", "pure": true}, {"t": "b", "who": "", "kind": "N", "text": "Кот смотрит на Лену так, будто она уезжает навсегда."}, {"t": "b", "who": "", "kind": "L", "text": "Solo es un año... o dos. Quizás más. Bueno, ¿quién sabe?", "ru": "Это всего на год... или на два. Может, больше. Ну, кто знает?", "pure": true}, {"t": "scene", "title": "Где мой паспорт?"}, {"t": "b", "who": "", "kind": "L", "text": "¿Dónde está mi cargador? ¿Debajo de la cama? No. ¿Detrás de la puerta? Tampoco.", "ru": "Где моя зарядка? Под кроватью? Нет. За дверью? Тоже нет.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Ah, aquí está, al lado del pasaporte. Siempre están juntos.", "ru": "А, вот она, рядом с паспортом. Они всегда вместе.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Cuándo sale el vuelo? Mañana temprano, a las seis. ¡Muy temprano!", "ru": "Когда вылет? Завтра рано, в шесть. Очень рано!", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Y para qué necesito tres bikinis? Para la playa, ¡por supuesto!", "ru": "А зачем мне три купальника? Для пляжа, разумеется!", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Entre la ropa y los libros, la maleta pesa casi treinta kilos. ¡Ay!", "ru": "Вместе с одеждой и книгами чемодан весит почти тридцать килограммов. Ой!", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Bueno, quizás no necesito todos los libros. Solo uno. O dos.", "ru": "Ладно, может, м  / её"], ["le / les", "ему, ей / им"], ["nos", "нам, нас"], ["mi / mis", "мой / мои"], ["tu / tus", "твой / твои"], ["su / sus", "его, её, ваш, их"], ["nuestro", "наш"], ["mío / tuyo", "мой / твой (после сущ.)"], ["este / esta", "этот / эта"], ["ese / esa", "тот / та (рядом)"], ["aquel", "тот (далеко)"], ["esto / eso", "это / то"], ["algo", "что-то"], ["nada", "ничего"], ["alguien", "кто-то"], ["nadie", "никто"], ["todo", "всё, весь"], ["cada", "каждый"], ["otro", "другой"], ["mismo", "тот же самый"], ["alguno", "какой-нибудь"], ["ninguno", "никакой"], ["vosotros / vosotras", "вы (мн., на «ты»)"], ["vuestro", "ваш"]]}]}, {"title": "Пересадка в Мадриде", "color": "TURQ", "items": [{"t": "b", "who": "", "kind": "L", "text": "Четыре часа в Барахасе. Отличное время повторить существительные. <b>El día, la vida, el mundo...</b>"}, {"t": "b", "who": "", "kind": "L", "text": "Стоп. Почему <b>el</b> día? Он же на -a! ¿En serio?"}, {"t": "scene", "title": "Сеньора у выхода на посадку"}, {"t": "b", "who": "", "kind": "N", "text": "Рядом с Леной садится пожилая сеньора и сразу начинает разговор."}, {"t": "b", "who": "Сеньора", "kind": "O", "text": "¿Es la primera vez que vas a Canarias, hija?", "ru": "Ты первый раз летишь на Канары, дочка?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Sí, señora. Voy a vivir allí. Tengo un trabajo nuevo.", "ru": "Да, сеньора. Я буду там жить. У меня новая работа.", "pure": true}, {"t": "b", "who": "Сеньора", "kind": "O", "text": "¡Qué bien! Yo voy a ver a mi familia. Tengo tres hijos y cinco nietos.", "ru": "Как хорошо! А я лечу к семье. У меня трое детей и пятеро внуков.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Y viven todos en la misma ciudad?", "ru": "И все живут в одном городе?", "pure": true}, {"t": "b", "who": "Сеньора", "kind": "O", "text": "Mi hijo vive en el centro, en un piso muy pequeño. Mi hija vive en un pueblo cerca del mar.", "ru": "Сын живёт в центре, в очень маленькой квартире. Дочь живёт в городке у моря.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¡Qué bonito! Yo también quiero vivir cerca del mar. Me encanta el agua.", "ru": "Как здорово! Я тоже хочу жить у моря. Обожаю воду.", "pure": true}, {"t": "b", "who": "Сеньора", "kind": "O", "text": "Mira, hija, la vida es corta. Hay que vivir en el lugar donde eres feliz.", "ru": "Послушай, дочка, жизнь короткая. Надо жить там, где ты счастлива.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Tiene razón, señora. Es una buena idea.", "ru": "Вы правы, сеньора. Это хорошая мысль.", "pure": true}, {"t": "scene", "title": "Который час?"}, {"t": "b", "who": "", "kind": "L", "text": "Perdón, ¿qué hora es?", "ru": "Извините, который час?", "pure": true}, {"t": "b", "who": "Парень", "kind": "O", "text": "Son las tres y media. ¿A qué hora es tu vuelo?", "ru": "Половина четвёртого. Во сколько твой рейс?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "A las cinco. Tengo una hora y media para comer algo.", "ru": "В пять. У меня полтора часа, чтобы что-нибудь съесть.", "pure": true}, {"t": "b", "who": "Парень", "kind": "O", "text": "¿Y cuánto tiempo dura el viaje?", "ru": "А сколько длится перелёт?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Tres horas. ¡Y el lunes ya tengo que trabajar!", "ru": "Три часа. А в понедельник мне уже на работу!", "pure": true}, {"t": "b", "who": "Парень", "kind": "O", "text": "Hoy es viernes. Tienes todo el fin de semana para descansar.", "ru": "Сегодня пятница. У тебя все выходные, чтобы отдохнуть.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Sí, el sábado y el domingo voy a dormir todo el día.", "ru": "Да, в субботу и воскресенье буду спать весь день.", "pure": true}, {"t": "b", "who": "Парень", "kind": "O", "text": "¡No, no! El primer fin de semana se va a la playa. Es la regla.", "ru": "Нет-нет! В первые выходные идут на пляж. Это правило.", "pure": true}, {"t": "scene", "title": "Магазин в аэропорту"}, {"t": "b", "who": "Продавщица", "kind": "O", "text": "¡Buenas tardes! ¿La puedo ayudar?", "ru": "Добрый день! Вам помочь?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Sí, busco un vestido para la playa. Algo sencillo, de un color claro.", "ru": "Да, ищу платье для пляжа. Что-нибудь простое, светлое.", "pure": true}, {"t": "b", "who": "Продавщица", "kind": "O", "text": "Tenemos este vestido blanco y esta camisa azul. ¿Qué color le gusta más?", "ru": "У нас есть это белое платье и эта голубая рубашка. Какой цвет вам больше нравится?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "El blanco es muy bonito. ¿Tienen zapatos del mismo color?", "ru": "Белое очень красивое. А обувь такого же цвета есть?", "pure": true}, {"t": "b", "who": "Продавщица", "kind": "O", "text": "Claro. Y esta bolsa también va muy bien con el vestido.", "ru": "Конечно. И эта сумка тоже отлично подходит к платью.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Ay, no. Mi maleta ya está llena de cosas. Solo el vestido, por favor.", "ru": "Ой, нет. Мой чемодан и так полон вещей. Только платье, пожалуйста.", "pure": true}, {"t": "b", "who": "Продавщица", "kind": "O", "text": "Perfecto. ¿Paga con tarjeta o en efectivo?", "ru": "Отлично. Вы платите картой или наличными?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Con tarjeta. ¡Gracias!", "ru": "Картой. Спасибо!", "pure": true}, {"t": "intro", "text": "Самые употребляемые существительные — их хватит, чтобы описать почти всё вокруг:"}, {"t": "words", "title": null, "tag": "существительные", "items": [["la persona", "человек"], ["el hombre", "мужчина, человек"], ["la mujer", "женщина"], ["el niño / la niña", "ребёнок, мальчик / девочка"], ["la gente", "люди"], ["el tiempo", "время; погода"], ["el año", "год"], ["el día", "день"], ["la semana", "неделя"], ["el mes", "месяц"], ["la hora", "час"], ["el minuto", "минута"], ["la mañana", "утро"], ["la tarde", "день (после обеда), вечер"], ["la noche", "ночь, ве da", "магазин"], ["la calle", "улица"], ["el centro", "центр"], ["el camino", "путь, дорога"], ["el coche", "машина"], ["el teléfono", "телефон"], ["el móvil", "мобильный"], ["el ordenador", "компьютер"], ["la luz", "свет"], ["el aire", "воздух"], ["el sol", "солнце"], ["la lluvia", "дождь"], ["la tierra", "земля"], ["la historia", "история"], ["el arte", "искусство"], ["la verdad", "правда"], ["la mentira", "ложь"], ["el amor", "любовь"], ["la paz", "мир, покой"], ["la guerra", "война"], ["el gobierno", "правительство"], ["el presidente", "президент"], ["la empresa", "компания"], ["el negocio", "бизнес, дело"], ["el sistema", "система"], ["el grupo", "группа"], ["el equipo", "команда; оборудование"], ["el resultado", "результат"], ["el ejemplo", "пример"], ["el caso", "случай"], ["el fin", "конец"], ["el principio", "начало"], ["el futuro", "будущее"], ["el pasado", "прошлое"], ["la ropa", "одежда"], ["los zapatos", "обувь"], ["las zapatillas", "кроссовки; тапочки"], ["la camisa", "рубашка"], ["los pantalones", "брюки"], ["el vestido", "платье"], ["la bolsa", "сумка; пакет"], ["el color", "цвет"], ["el tipo", "тип, вид"], ["el nivel", "уровень"], ["el sueño", "сон; мечта"], ["el miedo", "страх"], ["la suerte", "удача"], ["la oportunidad", "возможность, шанс"], ["la noticia", "новость"], ["el mensaje", "сообщение"], ["el cambio", "изменение; сдача"], ["la vista", "вид"], ["el animal", "животное"], ["el árbol", "дерево"], ["el río", "река"], ["el lago", "озеро"], ["el cielo", "небо"], ["la luna", "луна"], ["la estrella", "звезда"], ["el viento", "ветер"], ["el calor", "жара"], ["la temperatura", "температура"], ["el invierno", "зима"], ["el verano", "лето"], ["la primavera", "весна"], ["el otoño", "осень"], ["el lunes", "понедельник"], ["el martes", "вторник"], ["el miércoles", "среда"], ["el jueves", "четверг"], ["el viernes", "пятница"], ["el sábado", "суббота"], ["el domingo", "воскресенье"], ["el reloj", "часы"], ["la pared", "стена"], ["el suelo", "пол; почва"], ["el edificio", "здание"], ["el barrio", "район"], ["el vecino", "сосед"], ["la fecha", "дата"], ["el brazo", "рука (от плеча)"], ["la pierna", "нога"], ["el pelo", "волосы"], ["la boca", "рот"], ["la espalda", "спина"], ["el estómago", "живот, желудок"]]}]}, {"title": "Лена в аэропорту", "color": "VERDE", "items": [{"t": "b", "who": "", "kind": "L", "text": "¿Dónde está la pantalla? Ah, ahí. Mi vuelo a Gran Canaria sale de la puerta K12."}, {"t": "b", "who": "", "kind": "L", "text": "¿Qué? ¿<b>Con retraso</b> de dos horas? ¡Anda ya!"}, {"t": "b", "who": "", "kind": "L", "text": "Bueno, me tomo un café con leche. Y una caña... No, mejor un café. Y luego una caña."}, {"t": "b", "who": "", "kind": "L", "text": "Por fin embarcamos. Asiento 28B — en medio. Perfecto. Надо было делать check-in онлайн, а не мемы листать."}, {"t": "scene", "title": "Регистрация на рейс"}, {"t": "b", "who": "Агент", "kind": "O", "text": "Buenas tardes. Su pasaporte y su billete, por favor.", "ru": "Добрый день. Ваш паспорт и билет, пожалуйста.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Aquí tiene.", "ru": "Вот, пожалуйста.", "pure": true}, {"t": "b", "who": "Агент", "kind": "O", "text": "¿Va a facturar esta maleta?", "ru": "Вы будете сдавать этот чемодан?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Sí. Y la mochila es mi equipaje de mano.", "ru": "Да. А рюкзак — моя ручная кладь.", "pure": true}, {"t": "b", "who": "Агент", "kind": "O", "text": "Su maleta pesa veintiocho kilos. El máximo son veintitrés.", "ru": "Ваш чемодан весит двадцать восемь килограммов. Максимум — двадцать три.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿¡Qué!? ¿Puedo sacar algo?", "ru": "Что?! Можно я что-нибудь достану?", "pure": true}, {"t": "b", "who": "Агент", "kind": "O", "text": "Claro. O puede pagar sesenta euros.", "ru": "Конечно. Или можете заплатить шестьдесят евро.", "pure": true}, {"t": "b", "who": "", "kind": "N", "text": "Через пять минут Лена стояла у стойки в трёх свитерах и двух куртках."}, {"t": "b", "who": "Агент", "kind": "O", "text": "Muy bien. Aquí tiene su tarjeta de embarque. Puerta K12, asiento 28B.", "ru": "Отлично. Вот ваш посадочный талон. Выход K12, место 28B.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Es ventanilla o pasillo?", "ru": "Это у окна или у прохода?", "pure": true}, {"t": "b", "who": "Агент", "kind": "O", "text": "Ni ventanilla ni pasillo... en medio. Lo siento.", "ru": "Ни у окна, ни у прохода... посередине. Сожалею.", "pure": true}, {"t": "scene", "title": "В самолёте"}, {"t": "b", "who": "Стюардесса", "kind": "O", "text": "Señores pasajeros, bienvenidos a bordo. Vamos a despegar en diez minutos.", "ru": "Уважаемые пассажиры, добро пожаловать на борт. Мы взлетаем через десять минут.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Perdone, ¿me deja pasar? Necesito ir al baño.", "ru": "Простите, вы меня пропустите? Мне нужно в туалет.", "pure": true}, {"t": "b", "who": "Сеньор", "kind": "O", "text": "Claro, claro. ¿Es su primer viaje a Canarias?", "ru": "Конечно-конечно. Это ваша первая поездка на Канары?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Sí. Voy a trabajar allí. ¿Qué me recomienda visitar?", "ru": "Да. Я еду туда работать. Что вы посоветуете посмотреть?", "pure": true}, {"t": "b", "who": "Сеньор", "kind": "O", "text": "Las dunas de Maspalomas, las calas del norte y los volcanes de Lanzarote. ¡Y la playa, claro!", "ru": "Дюны Маспаломаса, бухты на севере и вулканы Лансароте. И пляж, конечно!", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Y necesito un guía?", "ru": "А мне нужен гид?", "pure": true}, {"t": "b", "who": "Сеньор", "kind": "O", "text": "Para las montañas, sí. Para la playa, solo crema solar.", "ru": "Для гор — да. Для пляжа — только крем от солнца.", "pure": true}, {"t": "b", "who": "Стюардесса", "kind": "O", "text": "Vamos a aterrizar en treinta minutos. La temperatura en destino es de veinticuatro grados.", "ru": "Мы приземлимся через тридцать минут. Температура в пункте назначения — двадцать четыре градуса.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¡Veinticuatro grados en noviembre! Me encanta este clima.", "ru": "Двадцать четыре градуса в ноябре! Обожаю этот климат.", "pure": true}, {"t": "tip", "label": "ПО-ИСПАНСКИ", "text": "В Испании сдать багаж — <b>facturar</b>, посадочный — <b>la tarjeta de embarque</b>, билет — <b>el billete</b>. И не забудьте перевести часы: на Канарах на час меньше, чем в Мадриде. «A las doce, las once en Canarias» — так даже по радио говорят.", "color": "VERDE"}, {"t": "intro", "text": "Пока Лена летит над Атлантикой, повторим всё, что нужно путешественнику:"}, {"t": "words", "title": null, "tag": "путешествия", "items": [["el aeropuerto", "аэропорт"], ["el vuelo", "рейс, перелёт"], ["el avión", "самолёт"], ["el billete", "билет"], ["el pasaporte", "паспорт"], ["la visa", "виза"], ["la maleta", "чемодан"], ["el equipaje", "багаж"], ["el equipaje de mano", "ручная кладь"], ["la mochila", "рюкзак"], ["facturar", "сдать багаж"], ["la tarjeta de embarque", "посадочный талон"], ["embarcar", "садиться на борт"], ["la puerta de embarque", "выход на посадку"], ["el embarque", "посадка"], ["despegar", "взлетать"], ["aterrizar", "приземляться"], ["el retraso", "задержка"], ["retrasado", "задержанный"], ["cancelado", "отменённый"], ["la salida", "выход; вылет"], ["la llegada", "прибытие"], ["la escala", "пересадка, стыковка"], ["el asiento", "место, кресло"], ["la ventanilla", "окно (в транспорте)"], ["el pasillo", "проход"], ["el pasajero", "пассажир"], ["la aduana", "таможня"], ["el control de pasaportes", "паспортный контроль"], ["el mostrador", "стойка"], ["la cinta de equipaje", "лента выдачи багажа"], ["objetos perdidos", "бюро находок"], ["el destino", "пункт назначения; судьба"], ["el viaje", "поездка, путешествие"], ["viajar", "путешествовать"], ["el turista", "турист"], ["la reserva", "бронь"], ["reservar", "бронировать"], ["el hotel", "отель"], ["el hostal", "хостел"], ["la habitación", "номер, комната"], ["la recepción", "ресепшн"], ["el ascensor", "лифт"], ["la escalera", "лестница"], ["la ducha", "душ"], ["la toalla", "полотенце"], ["el secador de pelo", "фен"], ["el aire acondicionado", "кондиционер"], ["el ventilador", "вентилятор"], ["la almohada", "подушка"], ["la manta", "одеяло, плед"], ["el desayuno", "завтрак"], ["la propina", "чаевые"], ["el efectivo", "наличные"], ["la tarjeta", "карта"], ["el cajero automático", "банкомат"], ["la moneda", "монета; валюта"], ["el precio", "цена"], ["barato", "дешёвый"], ["caro", "дорогой"], ["el descuento", "скидка"], ["el taxi", "такси"], ["el autobús", "автобус (на Канарах — la guagua)"], ["el metro", "метро"], ["la estación", "станция; время года"], ["la parada", "остановка"], ["el mapa", "карта (м. р., хотя на -a!)"], ["la dirección", "адрес; направление"], ["la esquina", "угол (улицы)"], ["la manzana", "квартал; яблоко"], ["a la derecha", "направо"], ["a la izquierda", "налево"], ["derecho", "прямо"], ["cruzar", "переходить"], ["el museo", "музей"], ["la iglesia", "церковь"], ["la plaza", "площадь"], ["el casco antiguo", "старый город"], ["el parque", "парк"], ["el mercado", "рынок"], ["la playa", "пляж"], ["el mar", "море"], ["la ola", "волна"], ["la arena", "песок"], ["surfear", "сёрфить"], ["la tabla de surf", "доска для сёрфа"], ["la crema solar", "солнцезащитный крем"], ["las vacaciones", "отпуск, каникулы"], ["pasear", "гулять"], ["el paseo", "прогулка"], ["la excursión", "экскурсия"], ["el guía", "гид"], ["el recuerdo", "сувенир; воспоминание"], ["el faro", "маяк"], ["las ruinas", "руины"], ["la cala", "бухточка"], ["las dunas", "дюны"], ["la montaña", "гора"], ["el volcán", "вулкан"], ["el seguro", "страховка"], ["perdido", "потерянный"], ["la llave", "ключ"], ["el clima", "климат, погода"], ["la frontera", "граница"], ["la carretera", "шоссе"], ["el peaje", "плата за дорогу"], ["la gasolinera", "заправка"], ["la estación de autobuses", "автовокзал"], ["el ferry", "паром (между островами)"], ["ida y vuelta", "туда и обратно"]]}]}, {"title": "Лена приземлилась", "color": "ROSA", "items": [{"t": "b", "who": "", "kind": "L", "text": "¡Ya estoy en Gran Canaria! Пальмы, ветер, океан. ¿Y mi maleta? Espero... espero... nada."}, {"t": "b", "who": "", "kind": "L", "text": "¿Dónde está la oficina de equipajes perdidos?"}, {"t": "b", "who": "Сотрудница", "kind": "O", "text": "Descríbame su maleta, mi niña."}, {"t": "b", "who": "", "kind": "L", "text": "Es <b>grande, negra, de piel</b>, con una cinta <b>roja</b>. Y está <b>llena</b> de comida rusa. ¡Muy importante!"}, {"t": "b", "who": "Сотрудница", "kind": "O", "text": "Llegará en dos o tres días. Tranquila, mi niña."}, {"t": "b", "who": "", "kind": "L", "text": "«Mi niña»? Я ей не дочь..."}, {"t": "b", "who": "", "kind": "N", "text": "Расслабьтесь: на Канарах «mi niño / mi niña» говорят всем подряд — от ребёнка до директора банка. А описать потерянный чемодан помогут прилагательные. Они обычно стоят после существительного и меняют окончание по роду: <b>una maleta negra — un coche negro</b>."}, {"t": "scene", "title": "Чемодан на ленте"}, {"t": "b", "who": "", "kind": "L", "text": "¡Esa es mi maleta! No... esa es negra, pero es pequeña. La mía es grande.", "ru": "Вот мой чемодан! Нет... этот чёрный, но маленький. Мой — большой.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Y esa? Es grande y negra... pero es de plástico, no de piel.", "ru": "А этот? Большой и чёрный... но пластиковый, а не кожаный.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Esa es vieja y fea. Seguro que no es la mía.", "ru": "Этот старый и некрасивый. Точно не мой.", "pure": true}, {"t": "b", "who": "Сеньор", "kind": "O", "text": "Perdone, señorita, esa maleta vieja y fea es mía.", "ru": "Простите, сеньорита, этот старый некрасивый чемодан — мой.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¡Ay, perdón! Es... muy original.", "ru": "Ой, извините! Он... очень оригинальный.", "pure": true}, {"t": "b", "who": "Сеньор", "kind": "O", "text": "Gracias. Es muy importante para mí: tiene cuarenta años.", "ru": "Спасибо. Он мне очень дорог: ему сорок лет.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Cuarenta años? ¡Increíble! Y está perfecto.", "ru": "Сорок лет? Невероятно! И в идеальном состоянии.", "pure": true}, {"t": "scene", "title": "Как добраться до центра"}, {"t": "b", "who": "", "kind": "L", "text": "Perdone, ¿cómo llego al centro?", "ru": "Простите, как мне добраться до центра?", "pure": true}, {"t": "b", "who": "Справочная", "kind": "O", "text": "Puede tomar la guagua o un taxi. La guagua es más barato, pero el taxi es más rápido.", "ru": "Можно на автобусе или на такси. Автобус дешевле, но такси быстрее.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Dónde está la parada?", "ru": "Где остановка?", "pure": true}, {"t": "b", "who": "Справочная", "kind": "O", "text": "Salga por esa puerta, gire a la derecha y siga todo recto dos minutos. La parada está en la esquina.", "ru": "Выйдите через ту дверь, поверните направо и идите прямо две минуты. Остановка на углу.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Tiene un mapa de la ciudad?", "ru": "У вас есть карта города?", "pure": true}, {"t": "b", "who": "Справочная", "kind": "O", "text": "Sí, aquí tiene. Es gratis.", "ru": "Да, вот, пожалуйста. Бесплатно.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Muchas gracias. Es usted muy amable.", "ru": "Большое спасибо. Вы очень любезны.", "pure": true}, {"t": "scene", "title": "Таксист-философ"}, {"t": "b", "who": "Таксист", "kind": "O", "text": "¿Qué le parece la isla?", "ru": "Как вам остров?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¡Es preciosa! El mar es tan azul... y el aire es tan limpio.", "ru": "Он прекрасный! Море такое синее... и воздух такой чистый.", "pure": true}, {"t": "b", "who": "Таксист", "kind": "O", "text": "Aquí el clima es perfecto: ni frío ni calor. Siempre veintipico grados.", "ru": "Климат тут идеальный: ни холодно, ни жарко. Всегда двадцать с чем-то градусов.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Y siempre hay tanto viento?", "ru": "А ветер всегда такой сильный?", "pure": true}, {"t": "b", "who": "Таксист", "kind": "O", "text": "Sí, son los alisios. Para el surf son buenísimos.", "ru": "Да, это пассаты. Для сёрфинга отличные.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Es caro vivir aquí?", "ru": "Здесь дорого жить?", "pure": true}, {"t": "b", "who": "Таксист", "kind": "O", "text": "Más barato que en Madrid. Pero los pisos cerca de la playa son caros.", "ru": "Дешевле, чем в Мадриде. Но квартиры у пляжа дорогие.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Es normal. Lo bonito siempre es caro.", "ru": "Это нормально. Всё красивое всегда дорогое.", "pure": true}, {"t": "b", "who": "Таксист", "kind": "O", "text": "¡Chacho, qué razón tienes!", "ru": "Ох, как же ты права!", "pure": true}, {"t": "words", "title": null, "tag": "прилагательные", "items": [["bueno", "хороший"], ["malo", "плохой"], ["grande", "большой"], ["pequeño", "маленький"], ["precioso", "прелестный, чудесный"], ["nuevo", "новый"], ["viejo", "старый"], ["joven", "молодой"], ["mayor", "старший"], ["menor", "младший"], ["largo", "длинный"], ["corto", "короткий"], ["alto", "высокий"], ["bajo", "низкий"], ["bonito", "красивый, милый"], ["mono", "милый, симпатичный (разг.)"], ["guapo", "красивый (о человеке)"], ["feo", "некрасивый"], ["hermoso", "прекрасный"], ["rico", "вкусный; богатый"], ["pobre", "бедный"], ["fácil", "лёгкий"], ["difícil", "трудный"], ["rápido", "быстрый"], ["lento", "медленный"], ["fuerte", "сильный"], ["débil", "слабый"], ["caliente", "горячий"], ["frío", "холодный"], ["limpio", "чистый"], ["sucio", "грязный"], ["lleno", "полный"], ["vacío", "пустой"], ["abierto", "открытый"], ["cerrado", "закрытый"], ["primero", "первый"], ["último", "последний"], ["siguiente", "следующий"], ["próximo", "ближайший, следующий"], ["mejor", "лучше, лучший"], ["peor", "хуже, худший"], ["importante", "важный"], ["necesario", "необходимый"], ["posible", "возможный"], ["imposible", "невозможный"], ["verdadero", "настоящий"], ["falso", "ложный"], ["cierto", "верный; некий"], ["seguro", "уверенный; безопасный"], ["oscuro", "тёмный"], ["blanco", "белый"], ["negro", "чёрный"], ["rojo", "красный"], ["azul", "синий"], ["verde", "зелёный"], ["amarillo", "жёлтый"], ["rosa / rosado", "розовый"], ["gris", "серый"], ["marrón", "коричневый"], ["de piel", "кожаный"], ["feliz", "счастливый"], ["contento", "довольный"], ["triste", "грустный"], ["cansado", "уставший"], ["enfermo", "больной"], ["ocupado", "занятой"], ["libre", "свободный"], ["listo", "готовый (estar); умный (ser)"], ["tranquilo", "спокойный"], ["nervioso", "нервный"], ["enfadado", "злой, рассерженный"], ["aburrido", "скучающий; скучный"], ["divertido", "весёлый"], ["interesante", "интересный"], ["raro", "странный"], ["normal", "обычный"], ["especial", "особенный"], ["diferente", "другой, разный"], ["igual", "одинаковый"], ["perfecto", "идеальный"], ["increíble", "невероятный"], ["terrible", "ужасный"], ["maravilloso", "чудесный"], ["genial", "гениальный, супер"], ["excelente", "отличный"], ["sencillo", "простой"], ["complicado", "сложный"], ["peligroso", "опасный"], ["ruidoso", "шумный"], ["callado", "тихий, молчаливый"], ["español", "испанский"], ["extranjero", "иностранный; иностранец"], ["ruso", "русский"], ["ancho", "широкий"], ["estrecho", "узкий"], ["pesado", "тяжёлый; занудный"], ["ligero", "лёгкий (по весу)"], ["suave", "мягкий"], ["duro", "твёрдый"], ["mojado", "мокрый"], ["seco", "сухой"], ["gordo", "толстый"], ["delgado", "худой"], ["moreno", "смуглый; темноволосый"], ["rubio", "светловолосый"], ["canario", "канарский; житель Канар"]]}, {"t": "tip", "label": "SER vs ESTAR", "text": "<b>Ser</b> или <b>estar</b>? <b>Es aburrido</b> — он скучный, <b>está aburrido</b> — ему скучно. <b>Es listo</b> — умный, <b>está listo</b> — готов. А <b>rico</b> про еду — «вкусный», про человека — «богатый».", "color": "ROSA"}]}, {"title": "Лена заселяется в отель", "color": "TURQ", "items": [{"t": "b", "who": "", "kind": "L", "text": "Buenas tardes. Tengo una reserva a nombre de Elena."}, {"t": "b", "who": "Ресепшн", "kind": "O", "text": "Bienvenida. Su habitación es la 405. Aquí tiene la llave. El ascensor está a la izquierda."}, {"t": "b", "who": "", "kind": "L", "text": "Habitación «con vistas al mar»... Вид на стену соседнего отеля. Y la ducha no tiene agua caliente. ¡Qué fuerte!"}, {"t": "b", "who": "", "kind": "L", "text": "¿Me podría traer un secador de pelo, por favor?"}, {"t": "b", "who": "", "kind": "L", "text": "Мне принесли... вентилятор. Bueno, con los alisios tampoco hace falta."}, {"t": "b", "who": "", "kind": "L", "text": "Ладно, пока волосы сохнут — загляну в приложение для знакомств. Oye... este chico es muy <b>mono</b>. Y parece <b>majo</b>."}, {"t": "scene", "title": "Звонок на ресепшн"}, {"t": "b", "who": "", "kind": "L", "text": "Hola, buenas noches. Llamo de la habitación 405.", "ru": "Здравствуйте, добрый вечер. Звоню из номера 405.", "pure": true}, {"t": "b", "who": "Ресепшн", "kind": "O", "text": "Buenas noches, ¿en qué le puedo ayudar?", "ru": "Добрый вечер, чем могу помочь?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "La ducha no tiene agua caliente. Y no hay toallas.", "ru": "В душе нет горячей воды. И полотенец нет.", "pure": true}, {"t": "b", "who": "Ресепшн", "kind": "O", "text": "Lo siento mucho. Ahora mismo le mandamos toallas limpias.", "ru": "Мне очень жаль. Сейчас пришлём вам чистые полотенца.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Y otra cosa: los vecinos de la 406 son muy ruidosos.", "ru": "И ещё: соседи из 406 очень шумные.", "pure": true}, {"t": "b", "who": "Ресепшн", "kind": "O", "text": "¿Ruidosos? En la 406 no hay nadie, señorita.", "ru": "Шумные? В 406 никого нет, сеньорита.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "... ¿Nadie? ¿Y quién canta?", "ru": "... Никого? А кто тогда поёт?", "pure": true}, {"t": "b", "who": "Ресепшн", "kind": "O", "text": "Ah, es el camarero del bar. Canta muy mal, pero es muy buena persona.", "ru": "А, это официант из бара. Поёт он ужасно, но человек очень хороший.", "pure": true}, {"t": "scene", "title": "Листаем анкеты"}, {"t": "b", "who": "", "kind": "N", "text": "Пока сохнут волосы, Лена листает анкеты в приложении."}, {"t": "b", "who": "Профиль", "kind": "O", "text": "«Soy trabajador, puntual y muy serio. Busco una mujer educada y tranquila.»", "ru": "«Я трудолюбивый, пунктуальный и очень серьёзный. Ищу воспитанную и спокойную женщину».", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Muy serio. Siguiente.", "ru": "Слишком серьёзный. Следующий.", "pure": true}, {"t": "b", "who": "Профиль", "kind": "O", "text": "«Soy divertido, cariñoso y un poco celoso.»", "ru": "«Я весёлый, ласковый и немного ревнивый».", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Celoso? No, gracias.", "ru": "Ревнивый? Нет, спасибо.", "pure": true}, {"t": "b", "who": "Профиль", "kind": "O", "text": "«Soy guapo, inteligente y rico.»", "ru": "«Я красивый, умный и богатый».", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Y muy presumido. ¡Siguiente!", "ru": "И очень хвастливый. Следующий!", "pure": true}, {"t": "b", "who": "Профиль", "kind": "O", "text": "«Soy un poco tímido, pero valiente: surfeo olas grandes. Me encantan los perros y el mar.»", "ru": "«Я немного застенчивый, но смелый: катаюсь на больших волнах. Обожаю собак и море».", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Tímido y valiente... ¡qué interesante! Este parece buena gente.", "ru": "Застенчивый и смелый... как интересно! Этот, кажется, хороший человек.", "pure": true}, {"t": "b", "who": "", "kind": "N", "text": "Анкета номер четыре — это Алекс."}, {"t": "intro", "text": "Чтобы описать человека, хватит этих слов:"}, {"t": "words", "title": null, "tag": "люди", "items": [["amable", "любезный"], ["simpático", "приятный, обаятельный"], ["antipático", "неприятный"], ["inteligente", "умный"], ["tonto", "глупый"], ["vago", "ленивый"], ["trabajador", "трудолюбивый"], ["puntual", "пунктуальный"], ["sincero", "искренний"], ["celoso", "ревнивый"], ["cariñoso", "ласковый"], ["educado", "вежливый"], ["grosero", "грубый"], ["valiente", "смелый"], ["tímido", "застенчивый"], ["orgulloso", "гордый"], ["preocupado", "обеспокоенный"], ["sorprendido", "удивлённый"], ["emocionado", "взволнованный (в хорошем смысле)"], ["enamorado", "влюблённый"], ["soltero", "холостой, не в отношениях"], ["casado", "женатый, замужем"], ["sano", "здоровый"], ["gracioso", "смешной, забавный"], ["buena gente", "хороший человек"], ["presumido", "хвастливый, задавака"]]}]}, {"title": "Лена идёт на свидание", "color": "ROSA", "items": [{"t": "b", "who": "", "kind": "L", "text": "Mi primera cita en Canarias. Se llama Álex. Что там в его <b>perfil</b>?"}, {"t": "b", "who": "Профиль", "kind": "O", "text": "«Diseñador. Surfista. Me gustan las cañas, el mar y los perros. Busco a alguien con buen rollo.»"}, {"t": "b", "who": "", "kind": "L", "text": "Surf y perros. Muy bien, Álex, muy bien."}, {"t": "b", "who": "Алекс", "kind": "O", "text": "¡Hola, Lena! ¿Qué tal el viaje?"}, {"t": "b", "who": "", "kind": "L", "text": "Largo. Y he perdido la maleta."}, {"t": "b", "who": "Алекс", "kind": "O", "text": "¡Qué fuerte! ¿Te apetece ir de tapas? Conozco un sitio genial en Las Canteras."}, {"t": "b", "who": "", "kind": "L", "text": "¡Vale! Тапас — лучший ответ на любую драму."}, {"t": "scene", "title": "За столиком"}, {"t": "b", "who": "Алекс", "kind": "O", "text": "Entonces, ¿estás soltera?", "ru": "Итак, ты не в отношениях?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Sí. Mi última relación terminó hace un año. ¿Y tú?", "ru": "Да. Мои последние отношения закончились год назад. А ты?", "pure": true}, {"t": "b", "who": "Алекс", "kind": "O", "text": "Yo también. Mi ex era muy celosa. Sin confianza no hay relación, ¿no crees?", "ru": "Я тоже. Моя бывшая была очень ревнивой. Без доверия нет отношений, правда?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Totalmente. Para mí lo más importante es el respeto... y el sentido del humor.", "ru": "Абсолютно. Для меня главное — уважение... и чувство юмора.", "pure": true}, {"t": "b", "who": "Алекс", "kind": "O", "text": "¿Te cuento un chiste?", "ru": "Рассказать анекдот?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¡Claro!", "ru": "Конечно!", "pure": true}, {"t": "b", "who": "Алекс", "kind": "O", "text": "¿Qué le dice una ola a otra ola? ¡Nos vemos en la playa!", "ru": "Что одна волна говорит другой? Увидимся на пляже!", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Jaja, es malísimo.", "ru": "Ха-ха, это ужасно.", "pure": true}, {"t": "b", "who": "Алекс", "kind": "O", "text": "Pero te estás riendo.", "ru": "Но ты же смеёшься.", "pure": true}, {"t": "b", "who": "", "kind": "N", "text": "Лена и правда смеётся. Кажется, химия есть."}, {"t": "scene", "title": "Переписка после свидания"}, {"t": "b", "who": "Алекс", "kind": "O", "text": "Me ha encantado la cita. ¿Has llegado bien a casa?", "ru": "Мне очень понравилось свидание. Ты нормально добралась до дома?", "pure": true}, {"t": "b", "who": "", "kind": "N", "text": "Лена видит сообщение только через два часа — она уснула."}, {"t": "b", "who": "Алекс", "kind": "O", "text": "¿Me has dejado en visto?", "ru": "Ты оставила меня на прочитанном?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¡No! Estaba dormida. Yo también me lo he pasado muy bien.", "ru": "Нет! Я спала. Мне тоже было очень хорошо.", "pure": true}, {"t": "b", "who": "Алекс", "kind": "O", "text": "¿Te puedo invitar a cenar el sábado? Conozco un lugar muy romántico.", "ru": "Можно пригласить тебя на ужин в субботу? Я знаю очень романтичное место.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Romántico? Uy... ¡Vale! Pero esta vez pago yo.", "ru": "Романтичное? Ох... Договорились! Но в этот раз плачу я.", "pure": true}, {"t": "b", "who": "Алекс", "kind": "O", "text": "Ni hablar. Un beso.", "ru": "И речи быть не может. Целую.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Un beso.", "ru": "Целую.", "pure": true}, {"t": "b", "who": "", "kind": "N", "text": "И да, бабочки в животе — mariposas en el estómago."}, {"t": "tip", "label": "ГРАММАТИКА НА ПОЛЯХ", "text": "Заметили «<b>he perdido</b> la maleta»? В Испании о событиях сегодняшнего дня говорят в <b>pretérito perfecto</b>: <b>hoy he comido</b>, <b>esta mañana he llegado</b>. В Латинской Америке в тех же фразах чаще простое прошедшее: <b>hoy comí</b>.", "color": "TURQ"}, {"t": "intro", "text": "Словарик для свиданий — от первого «hola» до «la media naranja»:"}, {"t": "words", "title": null, "tag": "свидание", "items": [["la cita", "свидание"], ["coquetear", "флиртовать"], ["ligar", "знакомиться, «клеить»"], ["salir con", "встречаться с"], ["el perfil", "профиль"], ["la foto", "фото (ж. р.!)"], ["la pareja", "пара; партнёр"], ["la relación", "отношения"], ["enamorarse", "влюбиться"], ["el beso", "поцелуй"], ["besar", "целовать"], ["el abrazo", "объятие"], ["abrazar", "обнимать"], ["echar de menos", "скучать"], ["querer", "хотеть; любить"], ["te quiero", "я тебя люблю (тепло)"], ["los celos", "ревность"], ["terminar", "расстаться; закончить"], ["dejar a alguien", "бросить кого-то"], ["el ex / la ex", "бывший / бывшая"], ["engañar", "обманывать, изменять"], ["la boda", "свадьба"], ["casarse", "жениться, выйти замуж"], ["el anillo", "кольцо"], ["comprometido", "помолвленный"], ["el divorcio", "развод"], ["el aniversario", "годовщина"], ["el regalo", "подарок"], ["las flores", "цветы"], ["la cena", "ужин"], ["el brindis", "тост"], ["¡Salud!", "За здоровье! / Будь здоров!"], ["bailar", "танцевать"], ["el baile", "танец"], ["el sentido del humor", "чувство юмора"], ["la broma", "шутка"], ["bromear", "шутить"], ["reírse", "смеяться"], ["el chiste", "анекдот"], ["la sonrisa", "улыбка"], ["sonreír", "улыбаться"], ["la mirada", "взгляд"], ["la confianza", "доверие"], ["el respeto", "уважение"], ["la química", "химия (между людьми)"], ["la pasión", "страсть"], ["el cariño", "нежность, привязанность"], ["el detalle", "знак внимания, мелочь"], ["dejar en visto", "оставить «на прочитанном»"], ["la media naranja", "вторая половинка"], ["el flechazo", "любовь с первого взгляда"], ["mariposas en el estómago", "бабочки в животе"], ["el ligue", "интрижка; тот, с кем флиртуешь"]]}]}, {"title": "Лена идёт по тапас", "color": "MARI", "items": [{"t": "b", "who": "Алекс", "kind": "O", "text": "¿Qué pedimos?"}, {"t": "b", "who": "", "kind": "L", "text": "Papas arrugadas con mojo, unas gambas y... ¿el mojo picón pica?"}, {"t": "b", "who": "Алекс", "kind": "O", "text": "Qué va, nada."}, {"t": "b", "who": "", "kind": "L", "text": "...<br/>¡¡¡AGUA!!! ¡¡¡AGUAAA!!!"}, {"t": "b", "who": "", "kind": "N", "text": "«Picón» и правда означает «острый». Алекс просто вырос на нём."}, {"t": "b", "who": "", "kind": "L", "text": "Уже 23:00, а кухня всё ещё работает. ¿Cuándo duerme esta gente?"}, {"t": "b", "who": "Алекс", "kind": "O", "text": "Me lo he pasado genial. ¿Quedamos el sábado para surfear?"}, {"t": "b", "who": "", "kind": "L", "text": "¡Venga! ¿Me cobras? — ой, это я официанту."}, {"t": "scene", "title": "На рынке"}, {"t": "b", "who": "Продавщица", "kind": "O", "text": "¿Qué te pongo, mi niña?", "ru": "Что тебе положить, дорогая?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Un kilo de papas, medio kilo de tomates y un poco de queso, por favor.", "ru": "Килограмм картошки, полкило помидоров и немного сыра, пожалуйста.", "pure": true}, {"t": "b", "who": "Продавщица", "kind": "O", "text": "¿Para papas arrugadas? Llévate también este mojo verde. Lo hago yo.", "ru": "Для папас аругадас? Возьми ещё этот зелёный мохо. Сама делаю.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿El verde pica?", "ru": "Зелёный острый?", "pure": true}, {"t": "b", "who": "Продавщица", "kind": "O", "text": "Qué va. El verde es suave. El rojo, el picón... ese sí pica un poquito.", "ru": "Да ну. Зелёный мягкий. А красный, пикон... вот он немножко острый.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Ya lo sé, jaja. ¿Cuánto es?", "ru": "Знаю уже, ха-ха. Сколько с меня?", "pure": true}, {"t": "b", "who": "Продавщица", "kind": "O", "text": "Son seis euros con cincuenta. ¿Quieres probar el queso? Es de cabra, de aquí.", "ru": "Шесть евро пятьдесят. Хочешь попробовать сыр? Козий, местный.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Mmm... ¡qué rico! Póngame doscientos gramos.", "ru": "М-м-м... как вкусно! Положите двести граммов.", "pure": true}, {"t": "scene", "title": "Утренний кофе"}, {"t": "b", "who": "Официант", "kind": "O", "text": "Buenos días. ¿Qué te pongo?", "ru": "Доброе утро. Что тебе принести?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Un café con leche y una tostada con tomate, por favor.", "ru": "Кофе с молоком и тост с помидором, пожалуйста.", "pure": true}, {"t": "b", "who": "Официант", "kind": "O", "text": "¿Has probado el barraquito? Es nuestro café especial.", "ru": "Ты пробовала баракито? Это наш фирменный кофе.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Qué lleva?", "ru": "А что в нём?", "pure": true}, {"t": "b", "who": "Официант", "kind": "O", "text": "Leche condensada, café, leche, un poco de licor y canela.", "ru": "Сгущёнка, кофе, молоко, немного ликёра и корица.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Licor? ¿A las nueve de la mañana?", "ru": "Ликёр? В девять утра?", "pure": true}, {"t": "b", "who": "Официант", "kind": "O", "text": "Aquí es normal, mi niña. Pero si quieres, te lo hago sin licor.", "ru": "Здесь это нормально, дорогая. Но если хочешь, сделаю без ликёра.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Vale, un barraquito sin licor. Y luego, ¿me cobras?", "ru": "Хорошо, один баракито без ликёра. И потом посчитаешь меня?", "pure": true}, {"t": "b", "who": "Официант", "kind": "O", "text": "Claro. ¡Que aproveche!", "ru": "Конечно. Приятного аппетита!", "pure": true}, {"t": "intro", "text": "Еда в Испании — это половина разговоров. Вот что точно пригодится:"}, {"t": "words", "title": null, "tag": "еда", "items": [["las tapas", "тапас, закуски"], ["la ración", "порция (больше тапы)"], ["el pincho", "закуска на шпажке / на хлебе"], ["la tortilla de patatas", "испанская тортилья с картошкой"], ["la paella", "паэлья"], ["el jamón", "хамон"], ["el queso", "сыр"], ["el chorizo", "чорисо (колбаса)"], ["las aceitunas", "оливки"], ["el aceite de oliva", "оливковое масло"], ["el pan", "хлеб"], ["el pollo", "курица"], ["la carne", "мясо"], ["el cerdo", "свинина"], ["la ternera", "говядина, телятина"], ["el pescado", "рыба (еда)"], ["los mariscos", "морепродукты"], ["las gambas", "креветки"], ["el pulpo", "осьминог"], ["el calamar", "кальмар"], ["el arroz", "рис"], ["el huevo", "яйцо"], ["la fruta", "фрукты"], ["la verdura", "овощи"], ["el tomate", "помидор"], ["la cebolla", "лук"], ["el ajo", "чеснок"], ["la sal", "соль"], ["el azúcar", "сахар"], ["el café con leche", "кофе с молоком"], ["el cortado", "эспрессо с каплей молока"], ["el barraquito", "канарский слоёный кофе с ликёром"], ["el té", "чай"], ["la leche", "молоко"], ["el zumo", "сок (Испания)"], ["la cerveza", "пиво"], ["el vino tinto / blanco", "красное / белое вино"], ["la sangría", "сангрия"], ["el tinto de verano", "вино с газировкой"], ["el camarero", "официант"], ["la carta", "меню"], ["el menú del día", "комплексный обед"], ["el plato", "тарелка; блюдо"], ["el vaso", "стакан"], ["la taza", "чашка"], ["el tenedor", "вилка"], ["el cuchillo", "нож"], ["la cuchara", "ложка"], ["la servilleta", "салфетка"], ["¡Que aproveche!", "Приятного аппетита!"], ["para llevar", "с собой"], ["tener hambre", "быть голодным"], ["tener sed", "хотеть пить"], ["picante", "острый"], ["dulce", "сладкий"], ["salado", "солёный"], ["riquísimo", "очень вкусный"], ["vegetariano", "вегетарианец"], ["probar", "пробовать"], ["pedir", "заказывать; просить"], ["¿Me cobras?", "посчитайте меня (попросить счёт)"], ["el almuerzo", "обед; поздний завтрак"], ["la merienda", "полдник"]]}, {"t": "tip", "label": "ПО-ИСПАНСКИ", "text": "Обед в Испании — около 14:00–15:30, ужин — в 21:00–22:30. В 19:00 вы найдёте открытыми только бары и <b>guiris</b>. Счёт просят так: <b>¿Me cobras?</b> или <b>La cuenta, por favor.</b> Сок — <b>zumo</b>, а не jugo; картошка на материке — <b>patatas</b>, на Канарах — <b>papas</b>.", "color": "MARI"}]}, {"title": "Первый день на работе", "color": "VERDE", "items": [{"t": "b", "who": "", "kind": "L", "text": "Primer día en la oficina. ¿Cómo llego? En guagua, quince minutos. Por la ventana — el océano. ¡Cómo mola!"}, {"t": "b", "who": "Начальница", "kind": "O", "text": "¡Bienvenida, Lena! A las diez tenemos reunión."}, {"t": "b", "who": "Коллега", "kind": "O", "text": "Te he añadido al grupo del equipo. Cualquier cosa, nos dices."}, {"t": "b", "who": "", "kind": "L", "text": "Кажется, я зря волновалась. ¡Qué buen rollo hay aquí!"}, {"t": "scene", "title": "Первое совещание"}, {"t": "b", "who": "Начальница", "kind": "O", "text": "Buenos días a todos. Hoy empezamos un proyecto nuevo con un cliente muy importante.", "ru": "Всем доброе утро. Сегодня мы начинаем новый проект с очень важным клиентом.", "pure": true}, {"t": "b", "who": "Начальница", "kind": "O", "text": "Lena, ¿puedes preparar el informe para el viernes?", "ru": "Лена, можешь подготовить отчёт к пятнице?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¿Este viernes? ¿Cuál es la fecha límite exacta?", "ru": "К этой пятнице? Какой точный дедлайн?", "pure": true}, {"t": "b", "who": "Начальница", "kind": "O", "text": "El viernes a las doce. Y el lunes hacemos la presentación al cliente.", "ru": "В пятницу в двенадцать. А в понедельник у нас презентация для клиента.", "pure": true}, {"t": "b", "who": "Марта", "kind": "O", "text": "Tranquila, yo te ayudo con la presentación.", "ru": "Спокойно, я помогу тебе с презентацией.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¡Gracias! Es mi primera semana y ya tengo mucha tarea.", "ru": "Спасибо! Это моя первая неделя, а у меня уже куча задач.", "pure": true}, {"t": "b", "who": "Начальница", "kind": "O", "text": "Así es la vida en la oficina. ¡Bienvenida al equipo!", "ru": "Такова офисная жизнь. Добро пожаловать в команду!", "pure": true}, {"t": "scene", "title": "Разговор у кофемашины"}, {"t": "b", "who": "Марта", "kind": "O", "text": "¿Ya has firmado el contrato?", "ru": "Ты уже подписала договор?", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Sí, ayer. ¿Aquí pagan cada mes?", "ru": "Да, вчера. Здесь платят раз в месяц?", "pure": true}, {"t": "b", "who": "Марта", "kind": "O", "text": "Sí, la nómina llega a final de mes. Y además hay dos pagas extra: en verano y en Navidad.", "ru": "Да, зарплата приходит в конце месяца. И ещё есть две дополнительные выплаты: летом и на Рождество.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "¡Qué guay! ¿Y se puede trabajar desde casa?", "ru": "Как классно! А можно работать из дома?", "pure": true}, {"t": "b", "who": "Марта", "kind": "O", "text": "Sí, tenemos dos días de teletrabajo a la semana.", "ru": "Да, у нас два дня удалёнки в неделю.", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "Perfecto. Esos días voy a trabajar desde la playa.", "ru": "Отлично. В эти дни буду работать с пляжа.", "pure": true}, {"t": "b", "who": "Марта", "kind": "O", "text": "Jaja, pero eso no se lo digas a la jefa.", "ru": "Ха-ха, только начальнице этого не говори.", "pure": true}, {"t": "scene", "title": "Комментарии под селфи"}, {"t": "b", "who": "", "kind": "N", "text": "Лена выкладывает селфи с командой. Через минуту приходят комментарии."}, {"t": "b", "who": "Комментарий", "kind": "O", "text": "q bonita foto!!", "ru": "какая красивая фотка!!", "pure": true}, {"t": "b", "who": "Комментарий", "kind": "O", "text": "tqm amiga, cdt mucho, bss", "ru": "очень тебя люблю, подруга, береги себя, целую", "pure": true}, {"t": "b", "who": "Комментарий", "kind": "O", "text": "x fin una foto tuya jajaja", "ru": "наконец-то твоя фотка ха-ха-ха", "pure": true}, {"t": "b", "who": "", "kind": "L", "text": "jajaja gracias a todos, salu2 desde Canarias!", "ru": "ха-ха-ха, всем спасибо, привет с Канар!", "pure": true}, {"t": "b", "who": "", "kind": "N", "text": "Последний комментарий — от Алекса. Лена улыбается и ставит лайк."}, {"t": "intro", "text": "Ловите главные слова про работу и деньги:"}, {"t": "words", "title": null, "tag": "работа", "items": [["la oficina", "офис"], ["el jefe / la jefa", "начальник / начальница"], ["el compañero de trabajo", "коллега"], ["la nómina", "зарплата; расчётный лист"], ["la reunión", "встреча"], ["el sueldo", "зарплата"], ["el contrato", "договор"], ["el proyecto", "проект"], ["la tarea", "задача; домашнее задание"], ["la fecha límite", "дедлайн"], ["el horario", "график, расписание"], ["el cliente", "клиент"], ["el banco", "банк"], ["el crédito", "кредит"], ["el préstamo", "заём"], ["la deuda", "долг"], ["la tasa de interés", "процентная ставка"], ["la inversión", "инвестиция"], ["el inmueble", "объект недвижимости"], ["el alquiler", "аренда"], ["el informe", "отчёт"], ["la presentación", "презентация"], ["el correo", "почта, e-mail"], ["el teletrabajo", "удалёнка"], ["renunciar", "уволиться"], ["contratar", "нанимать"], ["despedir", "уволить"], ["la entrevista", "собеседование, интервью"], ["la experiencia", "опыт"], ["la ganancia", "прибыль"], ["el coworking", "коворкинг"], ["el ascenso", "повышение"], ["la baja", "больничный"], ["la paga extra", "доп. зарплата (летом и на Рождество)"], ["el autónomo", "ИП, самозанятый"], [ let speakingBtn = null;
function speak(text, btn){
  if(!window.speechSynthesis){ toast('Озвучка не поддерживается в этом браузере'); return; }
  speechSynthesis.cancel();

  const u = new SpeechSynthesisUtterance(text);
  const lang = LANG[state.v];

let VMAP=null, VMAPv=null, ALLW=null;
function allWords(){ const out=[]; chapters().forEach((ch,ci)=>ch.items.forEach((it,ii)=>{ if(it.t==='words') it.items.forEach((w,k)=>out.push({n:numBase[ci+':'+ii]+k+1, es:w[0], ru:w[1], ci})); })); return out; }
function buildVMap(){
  if(VMAPv===state.v) return; VMAPv=state.v; VMAP=new Map(); ALLW=allWords();
  const put=(k,w)=>{ k=k.toLowerCase(); if(k && !VMAP.has(k)) VMAP.set(k,w); };
  ALLW.forEach(w=>{
    w.es.replace(/\(.*?\)/g,'').split(/\s\/\s/).forEach(v=>{
      v=v.replace(/[¿?¡!.…]/g,'').trim(); if(!v) return;
      const na=v.replace(ART,'').trim(); if(!na) return;
      put(na,w);
      if(/^\p{L}+$/u.test(na)){
        if(/o$/.test(na)){ put(na.slice(0,-1)+'a',w); put(na+'s',w); put(na.slice(0,-1)+'as',w); }
        else if(/[aeiouáéíóú]$/.test(na)) put(na+'s',w);
        else put(na+'es',w);
      }
    });
  });
}
function linkVocab(ci){
  buildVMap();
  const cur=new Set(ALLW.filter(w=>w.ci===ci).map(w=>w.n));
  main.querySelectorAll('.btxt').forEach(el=>{
    const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT); const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node=>{
      const toks=node.nodeValue.match(/\p{L}+|[^\p{L}]+/gu); if(!toks) return;
      const frag=document.createDocumentFragment(); let changed=false;
      for(let i=0;i<toks.length;){
        const t=toks[i];
        if(!/\p{L}/u.test(t)){ frag.appendChild(document.createTextNode(t)); i++; continue; }
        let hit=null, len=0;
        for(let L=4;L>=1;L--){
          if(i+2*(L-1)>=toks.length) continue;
          let ok=true, ph=toks[i];
          for(let k=1;k<L;k++){ if(toks[i+2*k-1]!==' '){ok=false;break;} ph+=' '+toks[i+2*k]; }
          if(!ok) continue;
          const w=VMAP.get(ph.toLowerCase());
          if(w && (L>1 || ph.length>3 || cur.has(w.n))){ hit=w; len=L; break; }
        }
        const prevT = i>0 ? toks[i-1] : '';
        const proper = /^\p{Lu}/u.test(t) && i>0 && !/[.!?¿¡«—:]\s*$/.test(prevT);
        if(hit && !CYR.test(t) && !proper){
          const sp=document.createElement('span'); sp.className='vw'+(cur.has(hit.n)?' cur':''); sp.dataset.n=hit.n; sp.tabIndex=0;
          sp.textContent=toks.slice(i,i+2*len-1).join(''); frag.appendChild(sp); i+=2*len-1; changed=true;
        } else { frag.appendChild(document.createTextNode(t)); i++; }
      }
      if(changed) node.parentNode.replaceChild(frag,node);
    });
  });
  main.querySelectorAll('.vw').forEach(v=>{ v.onclick=e=>{e.stopPropagation(); showPop(v);}; v.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();showPop(v);} }; });
}

function norm(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[¿¡?!.,;:«»"]/g,'').replace(/\s+/g,' ').trim(); }
function normAcc(s){ return s.toLowerCase().replace(/[¿¡?!.,;:«»"]/g,'').replace(/\s+/g,' ').trim(); }
const ART = /^(el|la|los|las|un|una|unos|unas)\s+/i;
function variants(es){
  const base = es.replace(/\(.*?\)/g,'').replace(/\.\.\./g,'').trim();
  const out = new Set();
  base.split(/\s\/\s/).forEach(v=>{ v=v.trim(); if(!v) return; out.add(v); const na=v.replace(ART,''); out.add(na); });
  return [...out];
}
function core(es){ // single-word form usable in a sentence, or null
  const v = es.replace(/\(.*?\)/g,'').split(/\s\/\s/)[0].trim().replace(ART,'').replace(/[¿¡?!]/g,'');
  return /^[\p{L}]{3,}$/u.test(v) ? v : null;
}
function allSentences(){
  const res=[]; chapters().forEach((ch,ci)=>ch.items.forEach(it=>{
    if(it.t!=='b') return;
    strip(it.text).replace(/[«»]/g,'').split(/(?<=[.!?…])\s+|\n/).map(s=>s.replace(/^—\s*/,'').trim()).filter(s=>s && !CYR.test(s)).forEach(s=>res.push({s,ci}));
  })); return res;
}
function findIn(sent, word){
  const re = new RegExp('(^|[^\\p{L}])('+word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?=[^\\p{L}]|$)','iu');
  const m = sent.match(re); return m ? {i:m.index+m[1].length, w:m[2]} : null;
}
function bestKey(){ return 'best-'+state.v; }

function buildSession(words, ci){
  const tasks=[]; const W = shuffle(words);
  const hasTTS = !!window.speechSynthesis;
  // 1. match pairs
  if(W.length>=4) tasks.push({type:'match', items:shuffle(words).slice(0,6)});
  // 2. listening
  if(hasTTS) shuffle(words).slice(0,3).forEach(w=>tasks.push({type:'listen', w}));
  // 3. cloze from story sentences
  const sents = shuffle(allSentences()); const used=new Set(); let cz=0;
  for(const w of shuffle(words)){
    if(cz>=3) break; const c=core(w.es); if(!c) continue;
    const pref = sents.filter(x=>x.ci===ci).concat(sents.filter(x=>x.ci!==ci));
    const hit = pref.find(x=>!used.has(x.s) && x.s.split(' ').length>=3 && findIn(x.s,c));
    if(hit){ used.add(hit.s); tasks.push({type:'cloze', w, s:hit.s, c}); cz++; }
  }
  // 4. typing
  shuffle(words.filter(w=>!/\.\.\.|\s\/\s/.test(w.es) && w.es.replace(/\(.*?\)/g,'').length<=22)).slice(0,3).forEach(w=>tasks.push({type:'type', w}));
  // 5. sentence builder
  const own = shuffle(allSentences().filter(x=>x.ci===ci)).concat(shuffle(allSentences()));
  const picks=[]; for(const x of own){ const n=x.s.split(' ').length; if(n>=4&&n<=9&&!picks.includes(x.s)&&!used.has(x.s)) picks.push(x.s); if(picks.length>=2) break; }
  picks.forEach(s=>tasks.push({type:'build', s}));
  return tasks;
}

function openTraining(ci, onlyWords){
  const words = onlyWords || chWords(ci);
  const tasks = buildSession(words, ci);
  let i=0, ok=0, total=0; const missed=new Map();
  const title = onlyWords ? 'Работа над ошибками' : 'Тренировка: глава '+(ci+1);
  const miss = w=>missed.set(w.n,w);
  function frame(body, hint){
    dlg.innerHTML = `<div class="qh"><strong>${title}</strong><span class="dcount">${i+1} / ${tasks.length}</span><button aria-label="Закрыть" id="qx">${ICON.x}</button></div>

    $('#qx').onclick=()=>{ speechSynthesis&&speechSynthesis.cancel(); dlg.close(); };

    $('#qgo').onclick=()=>{ i++; run(); }; $('#qgo').focus();
  }
  function run(){
    if(i>=tasks.length) return finish();
    const t=tasks[i];
    ({match:doMatch, listen:doListen, cloze:doCloze, type:doType, build:doBuild})[t.type](t);
  }
  function doMatch(t){
    const L=shuffle(t.items), R=shuffle(t.items);
    frame(`<div class="match"><div>${L.map(w=>`<button data-n="${w.n}" data-s="l">${w.es}</button>`).join('')}</div><div>${R.map(w=>`<button data-n="${w.n}" data-s="r">${w.ru}</button>`).join('')}</div></div>`, 'Соедините пары');
    let sel=null, left=t.items.length, errs=0;
    dlg.querySelectorAll('.match button').forEach(b=>b.onclick=()=>{
      if(b.disabled) return;
      if(b.dataset.s==='l') speak(wordSpeech(t.items.find(w=>w.n==b.dataset.n).es));
      if(!sel || sel.dataset.s===b.dataset.s){ if(sel) sel.classList.remove('sel'); sel=b; b.classList.add('sel'); return; }
      if(sel.dataset.n===b.dataset.n){ [sel,b].forEach(x=>{x.classList.remove('sel');x.classList.add('right');x.disabled=true;}); left--; sel=null;
        if(!left) nextBtn(errs===0, errs?`Ошибок: ${errs}`:'¡Perfecto!'); }
      else { errs++;
        const ln = sel.dataset.s==='l'?sel.dataset.n:b.dataset.n; miss(t.items.find(w=>w.n==ln));
        [sel,b].forEach(x=>{x.classList.add('wrong'); setTimeout(()=>x.classList.remove('wrong','sel'),450);}); sel=null; }
    });
  }
  function doListen(t){
    const opts = shuffle([t.w, ...shuffle(words.filter(x=>x.n!==t.w.n)).slice(0,3)]);
    frame(`<div class="qw"><button class="bigplay" id="pl" aria-label="Послушать ещё раз">${ICON.spk}</button><button class="chip" id="slow">медленнее</button></div>
      <div class="opts">${opts.map(o=>`<button data-n="${o.n}">${o.ru}</button>`).join('')}</div>`, 'Послушайте и выберите перевод');
    const say=(r)=>{ const u=wordSpeech(t.w.es); speak(u,$('#pl')); if(r){ speechSynthesis.cancel(); const x=new SpeechSynthesisUtterance(u); x.lang=LANG[state.v]; x.rate=.55; const v=voices.find(v=>v.lang.replace('_','-')===LANG[state.v])||voices.find(v=>v.lang.startsWith('es')); if(v)x.voice=v; speechSynthesis.speak(x);} };
    $('#pl').onclick=()=>say(); $('#slow').onclick=()=>say(true); setTimeout(say,250);
    choice(t.w, ()=>`<b>${t.w.es}</b> — ${t.w.ru}`);
  }
  function choice(w, reveal){
    dlg.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{
      const good=+b.dataset.n===w.n;
      dlg.querySelectorAll('.opts button').forEach(x=>{x.disabled=true; if(+x.dataset.n===w.n) x.classList.add('right');});
      if(!good){ b.classList.add('wrong'); miss(w); }
      nextBtn(good, reveal());
    });
  }
  function doCloze(t){
    const pos=findIn(t.s,t.c);
    const blank = t.s.slice(0,pos.i)+'<span class="gap">_____</span>'+t.s.slice(pos.i+pos.w.length);
    const pool = shuffle(words.filter(x=>x.n!==t.w.n).map(x=>({x,c:core(x.es)})).filter(o=>o.c && o.c.toLowerCase()!==t.c.toLowerCase())).slice(0,3);
    const opts = shuffle([{x:t.w,c:pos.w}, ...pool.map(o=>({x:o.x,c:o.c}))]);
    frame(`<p class="sent">${blank}</p><button class="chip" id="hint">Подсказка</button> <span id="hintT" class="dcount"></span>
      <div class="opts" style="margin-top:12px">${opts.map(o=>`<button data-n="${o.x.n}">${o.c}</button>`).join('')}</div>`, 'Вставьте пропущенное слово — фраза из истории Лены');
    $('#hint').onclick=()=>{$('#hintT').textContent='нужно слово: «'+t.w.ru+'»';};
    dlg.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{
      const good=+b.dataset.n===t.w.n;
      dlg.querySelectorAll('.opts button').forEach(x=>{x.disabled=true; if(+x.dataset.n===t.w.n) x.classList.add('right');});

  }
  function doType(t){
    frame(`<div class="qw">${t.w.ru}</div><div class="qhint">Напишите по-испански${ART.test(t.w.es)?' (артикль можно не писать)':''}</div>

      <button class="chip" id="bl">${ICON.spk.replace('<svg','<svg width="14" height="14" style="vertical-align:-2px"')} Послушать фразу</button>`, 'Соберите фразу из истории');
    $('#bl').onclick=()=>speak(t.s);
    const bt=$('#bt'), bk=$('#bk'); const picked=[];
    bk.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      picked.push(b.textContent); b.disabled=true;
      const s=document.createElement('button'); s.textContent=b.textContent; s.onclick=()=>{ picked.splice([...bt.children].indexOf(s),1); s.remove(); b.disabled=false; };
      bt.appendChild(s);
      if(picked.length===toks.length){
        const good = picked.join(' ')===t.s;
        bt.querySelectorAll('button').forEach(x=>x.disabled=true); bt.classList.add(good?'okb':'badb');

}
function renderTrainCard(ci){
  const words=chWords(ci); if(words.length<4) return '';
  const best=state.best[state.v][ci];
  return `<section class="train"><div class="trainart">${lena(best>=90?'happy':'wow')}</div><div>
    <h3>Тренировка по итогам главы</h3>
    <p>12 заданий на слова этой главы: найти пары, узнать слово на слух, вставить пропуск во фразу из истории, написать слово самому и собрать фразу из слов.</p>
    ${best!=null?`<p class="dcount">Лучший результат: ${best}%</p>`:''}
    <button class="cta2" data-train="${ci}">${best!=null?'Пройти ещё раз':'Начать тренировку'}</button></div></section>`;
}

const dlg = $('#quiz');
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function openQuiz(words, title){
  const known = state.known[state.v];
  let pool = shuffle(words.filter(w=>!known.has(w.n)));
  if(pool.length<8) pool = pool.concat(shuffle(words.filter(w=>known.has(w.n))));
  const qs = pool.slice(0, Math.min(10, words.length));
  let i=0, score=0, missed=[];
  const reverse = ()=>Math.random()<0.35;
  function q(){
    if(i>=qs.length) return done();
    const w=qs[i], rev=reverse();
    const others = shuffle(words.filter(x=>x.n!==w.n)).slice(0,3);
    const opts = shuffle([w,...others]);
    dlg.innerHTML = `<div class="qh"><strong>${title}</strong><span class="dcount">${i+1} / ${qs.length}</span><button aria-label="Закрыть" id="qx">${ICON.x}</button></div>
      <div class="qb"><div class="qbar"><i style="width:${i/qs.length*100}%"></i></div>
      <div class="qw">${rev? w.ru : w.es}${rev?'':`<button class="speak" id="qs" aria-label="Послушать">${ICON.spk}</button>`}</div>
      <div class="qhint">${rev?'Как это по-испански?':'Что это значит?'}</div>
      <div class="opts">${opts.map(o=>`<button data-n="${o.n}">${rev?o.es:o.ru}</button>`).join('')}</div><div id="qn"></div></div>`;
    $('#qx').onclick=()=>dlg.close();
    if(!rev){ const b=$('#qs'); b.onclick=()=>speak(wordSpeech(w.es),b); speak(wordSpeech(w.es), b); }
    dlg.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{
      const ok = +b.dataset.n===w.n;
      dlg.querySelectorAll('.opts button').forEach(x=>{ x.disabled=true; if(+x.dataset.n===w.n) x.classList.add('right'); });
      if(ok){ score++; } else { b.classList.add('wrong'); missed.push(w); }
      if(rev) speak(wordSpeech(w.es));
      $('#qn').innerHTML = `<button class="qnext" id="qgo">${i+1<qs.length?'Дальше':'Результат'}</button>`;
      $('#qgo').onclick=()=>{ i++; q(); }; $('#qgo').focus();
    });
  }
  function done(){
    const all = score===qs.length;
    dlg.innerHTML = `<div class="qh"><strong>${title}</strong><button aria-label="Закрыть" id="qx">${ICON.x}</button></div>
      <div class="qb" style="text-align:center"><div style="width:120px;margin:0 auto">${lena(all?'happy':score>=qs.length/2?'wow':'sad')}</div>
      <p class="score">${score} / ${qs.length}</p>
      <p>${all?'¡Perfecto! Все слова из теста отмечены как выученные.':missed.length?'Повторите: '+missed.map(m=>'<b>'+m.es+'</b>').join(', '):''}</p>
      <button class="qnext" id="qagain">Ещё раз</button></div>`;
    if(all){ qs.forEach(w=>state.known[state.v].add(w.n)); store.saveKnown(); updateProg(); renderChapterKeepScroll(); }
    $('#qx').onclick=()=>dlg.close(); $('#qagain').onclick=()=>openQuiz(words,title);
  }
  q(); if(!dlg.open) dlg.showModal();
}
function renderChapterKeepScroll(){ const y=window.scrollY; renderChapter(); window.scrollTo({top:y}); }
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2600); }

(async()=>{ await store.load(); setVersion(state.v); })();
</script>
